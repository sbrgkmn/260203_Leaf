<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>260203_Leaf</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Trebuchet MS", "Segoe UI", Tahoma, sans-serif;
        background: #ffffff;
        color: #111111;
      }
      .page {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 16px;
      }
      .title {
        font-size: 18px;
        letter-spacing: 0.2px;
        margin: 0;
      }
      .controls {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px 16px;
        align-items: center;
      }
      .control {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 13px;
      }
      .control-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .control input[type="range"] {
        width: 100%;
      }
      .control .value {
        font-variant-numeric: tabular-nums;
        min-width: 44px;
        text-align: right;
      }
      .tiles {
        display: flex;
        gap: 16px;
        overflow-x: auto;
        padding-bottom: 8px;
      }
      .tile {
        flex: 0 0 auto;
        width: 220px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .tile canvas {
        border: 1px solid #111111;
        background: #ffffff;
      }
      .tile .label {
        font-size: 12px;
        color: #222222;
      }
      .control button {
        padding: 6px 10px;
        border: 1px solid #111111;
        background: #ffffff;
        cursor: pointer;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <h1 class="title">260203_Leaf</h1>

      <div class="controls">
        <label class="control">
          <span>Steps</span>
          <div class="control-row">
            <input id="steps" type="range" min="0" max="8" step="1" value="5" />
            <span class="value" id="stepsVal"></span>
          </div>
        </label>

        <label class="control">
          <span>Position t</span>
          <div class="control-row">
            <input id="position" type="range" min="0" max="1" step="0.01" value="0.5" />
            <span class="value" id="positionVal"></span>
          </div>
        </label>

        <label class="control">
          <span>Intensity</span>
          <div class="control-row">
            <input id="intensity" type="range" min="0" max="1" step="0.01" value="0.35" />
            <span class="value" id="intensityVal"></span>
          </div>
        </label>

        <label class="control">
          <span>Angle (deg)</span>
          <div class="control-row">
            <input id="angle" type="range" min="-180" max="180" step="1" value="0" />
            <span class="value" id="angleVal"></span>
          </div>
        </label>

        <label class="control">
          <span>Side</span>
          <select id="side">
            <option value="right">Right</option>
            <option value="left">Left</option>
          </select>
        </label>

        <label class="control">
          <span>Contraction Position tc</span>
          <div class="control-row">
            <input id="contractionPosition" type="range" min="0" max="1" step="0.01" value="0.5" />
            <span class="value" id="contractionPositionVal"></span>
          </div>
        </label>

        <label class="control">
          <span>Contraction Intensity</span>
          <div class="control-row">
            <input id="contractionIntensity" type="range" min="0" max="1" step="0.01" value="0.5" />
            <span class="value" id="contractionIntensityVal"></span>
          </div>
        </label>

        <label class="control">
          <span>Show Construction Points</span>
          <div class="control-row">
            <input id="showConstructionPoints" type="checkbox" checked />
          </div>
        </label>

        <label class="control">
          <span>Show Construction Lines</span>
          <div class="control-row">
            <input id="showConstructionLines" type="checkbox" checked />
          </div>
        </label>

        <label class="control">
          <span>Jitter</span>
          <div class="control-row">
            <input id="jitter" type="checkbox" />
          </div>
        </label>

        <label class="control">
          <span>Jitter Amount</span>
          <div class="control-row">
            <input id="jitterAmount" type="range" min="0" max="0.3" step="0.01" value="0.08" />
            <span class="value" id="jitterVal"></span>
          </div>
        </label>

        <label class="control">
          <span>Export</span>
          <div class="control-row">
            <button id="exportSteps" type="button">Export PNG Steps</button>
          </div>
        </label>
      </div>

      <div class="tiles" id="tiles"></div>
    </div>

    <script>
      const TILE_SIZE = 220;
      const PADDING = 16;
      const EXPORT_SIZE = 640;
      const EXPORT_PADDING = 40;

      const ui = {
        steps: document.getElementById("steps"),
        position: document.getElementById("position"),
        intensity: document.getElementById("intensity"),
        angle: document.getElementById("angle"),
        side: document.getElementById("side"),
        contractionPosition: document.getElementById("contractionPosition"),
        contractionIntensity: document.getElementById("contractionIntensity"),
        showConstructionPoints: document.getElementById("showConstructionPoints"),
        showConstructionLines: document.getElementById("showConstructionLines"),
        jitter: document.getElementById("jitter"),
        jitterAmount: document.getElementById("jitterAmount"),
        stepsVal: document.getElementById("stepsVal"),
        positionVal: document.getElementById("positionVal"),
        intensityVal: document.getElementById("intensityVal"),
        angleVal: document.getElementById("angleVal"),
        contractionPositionVal: document.getElementById("contractionPositionVal"),
        contractionIntensityVal: document.getElementById("contractionIntensityVal"),
        jitterVal: document.getElementById("jitterVal"),
        tiles: document.getElementById("tiles"),
        exportSteps: document.getElementById("exportSteps"),
      };

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function rotateVec(v, angle) {
        const c = Math.cos(angle);
        const s = Math.sin(angle);
        return { x: v.x * c - v.y * s, y: v.x * s + v.y * c };
      }

      function uniquePoints(points, eps = 1e-6) {
        const out = [];
        for (const p of points) {
          let found = false;
          for (const q of out) {
            if (Math.abs(q.x - p.x) < eps && Math.abs(q.y - p.y) < eps) {
              found = true;
              break;
            }
          }
          if (!found) out.push(p);
        }
        return out;
      }

      function rand(seed) {
        const x = Math.sin(seed) * 43758.5453;
        return x - Math.floor(x);
      }

      function readParams() {
        const params = {
          steps: parseInt(ui.steps.value, 10),
          position: parseFloat(ui.position.value),
          intensity: parseFloat(ui.intensity.value),
          angle: parseFloat(ui.angle.value),
          side: ui.side.value,
          contractionPosition: parseFloat(ui.contractionPosition.value),
          contractionIntensity: parseFloat(ui.contractionIntensity.value),
          showConstructionPoints: ui.showConstructionPoints.checked,
          showConstructionLines: ui.showConstructionLines.checked,
          jitter: ui.jitter.checked,
          jitterAmount: parseFloat(ui.jitterAmount.value),
        };
        return params;
      }

      function updateReadouts(params) {
        ui.stepsVal.textContent = params.steps;
        ui.positionVal.textContent = params.position.toFixed(2);
        ui.intensityVal.textContent = params.intensity.toFixed(2);
        ui.angleVal.textContent = params.angle.toFixed(0);
        ui.contractionPositionVal.textContent = params.contractionPosition.toFixed(2);
        ui.contractionIntensityVal.textContent = params.contractionIntensity.toFixed(2);
        ui.jitterVal.textContent = params.jitterAmount.toFixed(2);
        ui.jitterAmount.disabled = !params.jitter;
      }

      function generateSteps(params) {
        const steps = [];
        const baseLine = [
          { x: 0, y: -0.5 },
          { x: 0, y: 0.5 },
        ];
        steps.push({
          points: baseLine,
          construction: { bases: [], links: [], inserted: [] },
          prevPoints: null,
          meta: { type: "initial", center: null, targets: [] },
        });

        for (let i = 1; i <= params.steps; i += 1) {
          const prev = steps[i - 1];
          const isExpansion = i % 2 === 1;
          const next = isExpansion
            ? expandPolyline(prev.points, params, i)
            : contractPolyline(prev.points, params, i, prev.meta.targets, prev.meta.center);
          steps.push({
            points: next.points,
            construction: next.construction,
            prevPoints: prev.points,
            meta: next.meta,
          });
        }

        return steps;
      }

      function expandPolyline(points, params, stepIndex) {
        if (!points || points.length < 2) {
          return {
            points: points ? points.slice() : [],
            construction: { bases: [], links: [], inserted: [] },
            meta: { type: "expansion", center: { x: 0, y: 0 }, expansionPoints: [], targets: [] },
          };
        }

        const newPoints = [points[0]];
        const tBase = clamp(params.position, 0, 1);
        const intensity = clamp(params.intensity, 0, 1);
        const angleBase = (params.angle * Math.PI) / 180;
        const sideLeft = params.side === "left";
        const jitterAmount = clamp(params.jitterAmount, 0, 0.5);
        const construction = { bases: [], links: [], inserted: [] };
        const expansionPoints = [];
        const targets = [];

        for (let i = 0; i < points.length - 1; i += 1) {
          const p0 = points[i];
          const p1 = points[i + 1];
          const dx = p1.x - p0.x;
          const dy = p1.y - p0.y;
          const len = Math.hypot(dx, dy);

          if (len < 1e-9) {
            newPoints.push({ x: p0.x, y: p0.y });
            newPoints.push({ x: p1.x, y: p1.y });
            continue;
          }

          let t = tBase;
          let angle = angleBase;
          let magnitude = len * intensity;

          if (params.jitter) {
            const seedBase = (stepIndex + 1) * 9283.123 + (i + 1) * 137.57;
            const j1 = rand(seedBase + 0.17) - 0.5;
            const j2 = rand(seedBase + 3.49) - 0.5;
            const j3 = rand(seedBase + 8.91) - 0.5;
            t = clamp(t + j1 * jitterAmount, 0, 1);
            angle += j2 * jitterAmount * Math.PI;
            magnitude *= 1 + j3 * jitterAmount;
          }

          const base = { x: p0.x + dx * t, y: p0.y + dy * t };
          const dir = { x: dx / len, y: dy / len };
          let perp = sideLeft ? { x: -dir.y, y: dir.x } : { x: dir.y, y: -dir.x };
          perp = rotateVec(perp, angle);

          const pNew = {
            x: base.x + perp.x * magnitude,
            y: base.y + perp.y * magnitude,
          };

          construction.bases.push(base);
          construction.links.push({ a: base, b: pNew });
          construction.inserted.push(pNew);
          expansionPoints.push(pNew);
          targets.push(base, base);

          newPoints.push(pNew);
          newPoints.push(p1);
        }

        const basePoints = construction.bases;
        const center =
          basePoints.length > 0
            ? basePoints.reduce(
                (acc, p) => ({ x: acc.x + p.x, y: acc.y + p.y }),
                { x: 0, y: 0 }
              )
            : { x: 0, y: 0 };
        if (basePoints.length > 0) {
          center.x /= basePoints.length;
          center.y /= basePoints.length;
        }

        return {
          points: newPoints,
          construction,
          meta: { type: "expansion", center, expansionPoints, targets },
        };
      }

      function contractPolyline(points, params, stepIndex, targets, center) {
        if (!points || points.length < 2) {
          return {
            points: points ? points.slice() : [],
            construction: { bases: [], links: [], inserted: [] },
            meta: { type: "contraction", center: center || { x: 0, y: 0 }, targets: [] },
          };
        }

        const fallback = center || { x: 0, y: 0 };
        const newPoints = [points[0]];
        const tBase = clamp(params.contractionPosition, 0, 1);
        const intensity = clamp(params.contractionIntensity, 0, 1);
        const construction = { bases: [], links: [], inserted: [] };

        for (let i = 0; i < points.length - 1; i += 1) {
          const p0 = points[i];
          const p1 = points[i + 1];
          const dx = p1.x - p0.x;
          const dy = p1.y - p0.y;
          const len = Math.hypot(dx, dy);

          if (len < 1e-9) {
            newPoints.push({ x: p0.x, y: p0.y });
            newPoints.push({ x: p1.x, y: p1.y });
            continue;
          }

          const base = { x: p0.x + dx * tBase, y: p0.y + dy * tBase };
          const target = targets && targets[i] ? targets[i] : fallback;
          const toCenter = { x: target.x - base.x, y: target.y - base.y };
          const pNew = {
            x: base.x + toCenter.x * intensity,
            y: base.y + toCenter.y * intensity,
          };

          construction.bases.push(base);
          construction.links.push({ a: base, b: pNew });
          construction.inserted.push(pNew);
          newPoints.push(pNew);
          newPoints.push(p1);
        }

        return {
          points: newPoints,
          construction,
          meta: { type: "contraction", center: fallback, targets: targets || [] },
        };
      }

      function computeBounds(points) {
        let minX = Infinity;
        let minY = Infinity;
        let maxX = -Infinity;
        let maxY = -Infinity;

        for (const p of points) {
          if (!p) continue;
          minX = Math.min(minX, p.x);
          minY = Math.min(minY, p.y);
          maxX = Math.max(maxX, p.x);
          maxY = Math.max(maxY, p.y);
        }

        return { minX, minY, maxX, maxY };
      }

      function fitToCanvas(points, width, height, padding, symmetric = false) {
        let { minX, minY, maxX, maxY } = computeBounds(points);

        if (!Number.isFinite(minX)) {
          minX = -1;
          minY = -1;
          maxX = 1;
          maxY = 1;
        }

        if (symmetric) {
          const maxAbsX = Math.max(Math.abs(minX), Math.abs(maxX), 1e-6);
          const maxAbsY = Math.max(Math.abs(minY), Math.abs(maxY), 1e-6);
          minX = -maxAbsX;
          maxX = maxAbsX;
          minY = -maxAbsY;
          maxY = maxAbsY;
        }

        const dx = Math.max(1e-6, maxX - minX);
        const dy = Math.max(1e-6, maxY - minY);
        const scale = Math.min((width - padding * 2) / dx, (height - padding * 2) / dy);
        const cx = (minX + maxX) / 2;
        const cy = (minY + maxY) / 2;

        return { scale, cx, cy, width, height };
      }

      function worldToCanvas(p, t) {
        const x = (p.x - t.cx) * t.scale + t.width / 2;
        const y = (-(p.y - t.cy)) * t.scale + t.height / 2;
        return { x, y };
      }

      function drawStepToContext(ctx, step, params, size, padding, isExport = false) {
        ctx.clearRect(0, 0, size, size);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, size, size);

        const points = step.points;
        if (!points || points.length < 2) return;

        const transform = fitToCanvas(points, size, size, padding, true);
        const style = isExport
          ? {
              mainStroke: "rgb(0, 0, 0)",
              prevStroke: "rgb(160, 160, 160)",
              constructionStroke: "rgb(120, 120, 120)",
              baseFill: "rgb(208, 64, 50)",
              centerFill: "rgb(29, 111, 66)",
              mainWidth: 2.2,
              prevWidth: 1.2,
              constructionWidth: 1.0,
              baseRadius: 3.2,
              centerRadius: 3.4,
            }
          : {
              mainStroke: "#111111",
              prevStroke: "rgba(0, 0, 0, 0.25)",
              constructionStroke: "rgba(0, 0, 0, 0.45)",
              baseFill: "#d04032",
              centerFill: "#1d6f42",
              mainWidth: 1.2,
              prevWidth: 0.8,
              constructionWidth: 0.9,
              baseRadius: 2.4,
              centerRadius: 2.6,
            };

        if (step.prevPoints && step.prevPoints.length >= 2) {
          ctx.strokeStyle = style.prevStroke;
          ctx.lineWidth = style.prevWidth;
          ctx.beginPath();
          const prevFirst = worldToCanvas(step.prevPoints[0], transform);
          ctx.moveTo(prevFirst.x, prevFirst.y);
          for (let i = 1; i < step.prevPoints.length; i += 1) {
            const pt = worldToCanvas(step.prevPoints[i], transform);
            ctx.lineTo(pt.x, pt.y);
          }
          ctx.stroke();
        }

        if (params.showConstructionPoints && step.meta) {
          const targetList = step.meta.targets && step.meta.targets.length > 0 ? step.meta.targets : [];
          const centers = targetList.length
            ? uniquePoints(targetList)
            : step.meta.center
            ? [step.meta.center]
            : [];
          if (centers.length) {
            ctx.fillStyle = style.centerFill;
            for (const center of centers) {
              const c = worldToCanvas(center, transform);
              ctx.beginPath();
              ctx.arc(c.x, c.y, style.centerRadius, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }

        ctx.strokeStyle = style.mainStroke;
        ctx.lineWidth = style.mainWidth;
        ctx.beginPath();

        const first = worldToCanvas(points[0], transform);
        ctx.moveTo(first.x, first.y);

        for (let i = 1; i < points.length; i += 1) {
          const pt = worldToCanvas(points[i], transform);
          ctx.lineTo(pt.x, pt.y);
        }

        ctx.stroke();

        if (step.construction.links.length && params.showConstructionLines) {
          ctx.strokeStyle = style.constructionStroke;
          ctx.lineWidth = style.constructionWidth;
          ctx.setLineDash([4, 3]);
          ctx.beginPath();
          for (const seg of step.construction.links) {
            const a = worldToCanvas(seg.a, transform);
            const b = worldToCanvas(seg.b, transform);
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
          }
          ctx.stroke();
          ctx.setLineDash([]);
        }

        if (params.showConstructionPoints) {
          ctx.fillStyle = style.baseFill;
          for (const base of step.construction.bases) {
            const pt = worldToCanvas(base, transform);
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, style.baseRadius, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      function drawStep(canvas, step, params) {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round(TILE_SIZE * dpr);
        canvas.height = Math.round(TILE_SIZE * dpr);
        canvas.style.width = `${TILE_SIZE}px`;
        canvas.style.height = `${TILE_SIZE}px`;

        const ctx = canvas.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        drawStepToContext(ctx, step, params, TILE_SIZE, PADDING);
      }

      function renderSteps(stepPolylines, params) {
        ui.tiles.innerHTML = "";
        const startIndex = stepPolylines.length > 1 ? 1 : 0;
        stepPolylines.slice(startIndex).forEach((step, offset) => {
          const index = startIndex + offset;
          const tile = document.createElement("div");
          tile.className = "tile";

          const canvas = document.createElement("canvas");
          const label = document.createElement("div");
          label.className = "label";
          label.textContent = `Step ${index}`;

          tile.appendChild(canvas);
          tile.appendChild(label);
          ui.tiles.appendChild(tile);

          drawStep(canvas, step, params);
        });
      }

      function update() {
        const params = readParams();
        updateReadouts(params);
        const steps = generateSteps(params);
        renderSteps(steps, params);
      }

      const inputs = document.querySelectorAll("input, select");
      inputs.forEach((input) => input.addEventListener("input", update));
      window.addEventListener("resize", update);
      ui.exportSteps.addEventListener("click", () => exportSteps());

      update();

      function canvasToBlob(canvas) {
        return new Promise((resolve) => {
          canvas.toBlob((blob) => resolve(blob), "image/png");
        });
      }

      async function exportSteps() {
        const params = readParams();
        const steps = generateSteps(params);

        const offscreen = document.createElement("canvas");
        offscreen.width = EXPORT_SIZE;
        offscreen.height = EXPORT_SIZE;
        const ctx = offscreen.getContext("2d");

        const startIndex = steps.length > 1 ? 1 : 0;
        for (let i = startIndex; i < steps.length; i += 1) {
          drawStepToContext(ctx, steps[i], params, EXPORT_SIZE, EXPORT_PADDING, true);
          const blob = await canvasToBlob(offscreen);
          if (!blob) continue;
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.download = `step_${String(i).padStart(2, "0")}.png`;
          link.href = url;
          link.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          await new Promise((resolve) => setTimeout(resolve, 120));
        }
      }
    </script>
  </body>
</html>
