<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>260203_Leaf</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Trebuchet MS", "Segoe UI", Tahoma, sans-serif;
        background: #ffffff;
        color: #111111;
      }
      .page {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 16px;
      }
      .title {
        font-size: 18px;
        letter-spacing: 0.2px;
        margin: 0;
      }
      .controls {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px 16px;
        align-items: center;
      }
      .control {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 13px;
      }
      .control-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .control input[type="range"] {
        width: 100%;
      }
      .control .value {
        font-variant-numeric: tabular-nums;
        min-width: 44px;
        text-align: right;
      }
      .tiles {
        display: grid;
        grid-template-columns: repeat(4, max-content);
        gap: 16px;
        overflow-x: auto;
        padding-bottom: 8px;
      }
      .tile {
        width: 400px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .tile canvas {
        border: 1px solid #111111;
        background: #ffffff;
      }
      .tile .label {
        font-size: 12px;
        color: #222222;
      }
      .control button {
        padding: 6px 10px;
        border: 1px solid #111111;
        background: #ffffff;
        cursor: pointer;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <h1 class="title">260203_Leaf</h1>

      <div class="controls">
        <label class="control">
          <span>Position t</span>
          <div class="control-row">
            <input id="position" type="range" min="0" max="1" step="0.01" value="0.5" />
            <span class="value" id="positionVal"></span>
          </div>
        </label>

        <label class="control">
          <span>Intensity</span>
          <div class="control-row">
            <input id="intensity" type="range" min="0" max="1" step="0.01" value="0.35" />
            <span class="value" id="intensityVal"></span>
          </div>
        </label>

        <label class="control">
          <span>Angle (deg)</span>
          <div class="control-row">
            <input id="angle" type="range" min="-180" max="180" step="1" value="0" />
            <span class="value" id="angleVal"></span>
          </div>
        </label>

        <label class="control">
          <span>Contraction Position tc</span>
          <div class="control-row">
            <input id="contractionPosition" type="range" min="0" max="1" step="0.01" value="0.5" />
            <span class="value" id="contractionPositionVal"></span>
          </div>
        </label>

        <label class="control">
          <span>Contraction Intensity</span>
          <div class="control-row">
            <input id="contractionIntensity" type="range" min="0" max="1" step="0.01" value="0.5" />
            <span class="value" id="contractionIntensityVal"></span>
          </div>
        </label>

        <label class="control">
          <span>Min Edge Length</span>
          <div class="control-row">
            <input id="minEdgeLength" type="range" min="0" max="0.5" step="0.01" value="0.08" />
            <span class="value" id="minEdgeLengthVal"></span>
          </div>
        </label>

        <label class="control">
          <span>Show Construction Points</span>
          <div class="control-row">
            <input id="showConstructionPoints" type="checkbox" checked />
          </div>
        </label>

        <label class="control">
          <span>Show Construction Lines</span>
          <div class="control-row">
            <input id="showConstructionLines" type="checkbox" checked />
          </div>
        </label>

        <label class="control">
          <span>Show Axis</span>
          <div class="control-row">
            <input id="showAxis" type="checkbox" checked />
          </div>
        </label>

        <label class="control">
          <span>Show Polarity Points</span>
          <div class="control-row">
            <input id="showPolarityPoints" type="checkbox" checked />
          </div>
        </label>

        <label class="control">
          <span>Stop Neg-Neg Edges</span>
          <div class="control-row">
            <input id="stopNegNeg" type="checkbox" checked />
          </div>
        </label>

        <label class="control">
          <span>Jitter</span>
          <div class="control-row">
            <input id="jitter" type="checkbox" />
          </div>
        </label>

        <label class="control">
          <span>Jitter Amount</span>
          <div class="control-row">
            <input id="jitterAmount" type="range" min="0" max="0.3" step="0.01" value="0.08" />
            <span class="value" id="jitterVal"></span>
          </div>
        </label>

        <label class="control">
          <span>Export</span>
          <div class="control-row">
            <button id="exportSteps" type="button">Export PNG Steps</button>
          </div>
        </label>
      </div>

      <div class="tiles" id="tiles"></div>
    </div>

    <script>
      const TILE_SIZE = 400;
      const PADDING = 28;
      const EXPORT_SIZE = 640;
      const EXPORT_PADDING = 40;
      const BASE_AXIS_LENGTH = 1;
      const SYMMETRIC_DISPLAY = true;

      const ui = {
        position: document.getElementById("position"),
        intensity: document.getElementById("intensity"),
        angle: document.getElementById("angle"),
        contractionPosition: document.getElementById("contractionPosition"),
        contractionIntensity: document.getElementById("contractionIntensity"),
        minEdgeLength: document.getElementById("minEdgeLength"),
        showConstructionPoints: document.getElementById("showConstructionPoints"),
        showConstructionLines: document.getElementById("showConstructionLines"),
        showAxis: document.getElementById("showAxis"),
        showPolarityPoints: document.getElementById("showPolarityPoints"),
        stopNegNeg: document.getElementById("stopNegNeg"),
        jitter: document.getElementById("jitter"),
        jitterAmount: document.getElementById("jitterAmount"),
        positionVal: document.getElementById("positionVal"),
        intensityVal: document.getElementById("intensityVal"),
        angleVal: document.getElementById("angleVal"),
        contractionPositionVal: document.getElementById("contractionPositionVal"),
        contractionIntensityVal: document.getElementById("contractionIntensityVal"),
        minEdgeLengthVal: document.getElementById("minEdgeLengthVal"),
        jitterVal: document.getElementById("jitterVal"),
        tiles: document.getElementById("tiles"),
        exportSteps: document.getElementById("exportSteps"),
      };

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function rotateVec(v, angle) {
        const c = Math.cos(angle);
        const s = Math.sin(angle);
        return { x: v.x * c - v.y * s, y: v.x * s + v.y * c };
      }

      function normalizeVec(v, fallback = { x: 0, y: 1 }) {
        const len = Math.hypot(v.x, v.y);
        if (len < 1e-9) return { x: fallback.x, y: fallback.y };
        return { x: v.x / len, y: v.y / len };
      }

      function projectPointToAxis(p, axis) {
        if (!axis || !axis.anchor || !axis.dir) return { x: p.x, y: p.y };
        const v = { x: p.x - axis.anchor.x, y: p.y - axis.anchor.y };
        const t = v.x * axis.dir.x + v.y * axis.dir.y;
        return { x: axis.anchor.x + axis.dir.x * t, y: axis.anchor.y + axis.dir.y * t };
      }

      function segmentOrientation(polA, polB, fallback = 1) {
        if (polA < 0 && polB >= 0) return 1;
        if (polB < 0 && polA >= 0) return -1;
        return fallback || 1;
      }

      function mirrorPoint(p) {
        return { x: -p.x, y: p.y };
      }

      function mirrorPoints(points) {
        return points.map(mirrorPoint);
      }

      function mirrorSegments(segments) {
        return segments.map((seg) => ({ a: mirrorPoint(seg.a), b: mirrorPoint(seg.b) }));
      }

      function uniquePoints(points, eps = 1e-6) {
        const out = [];
        for (const p of points) {
          if (!p) continue;
          let found = false;
          for (const q of out) {
            if (Math.abs(q.x - p.x) < eps && Math.abs(q.y - p.y) < eps) {
              found = true;
              break;
            }
          }
          if (!found) out.push(p);
        }
        return out;
      }

      function rand(seed) {
        const x = Math.sin(seed) * 43758.5453;
        return x - Math.floor(x);
      }

      function snapshotAxes(axes) {
        return axes.map((axis) => ({
          id: axis.id,
          parent: axis.parent,
          anchor: { x: axis.anchor.x, y: axis.anchor.y },
          tip: { x: axis.tip.x, y: axis.tip.y },
          dir: { x: axis.dir.x, y: axis.dir.y },
        }));
      }

      function buildNodeGraph(points, pointRule, pointAxis, insertedMeta) {
        const nodes = [];
        for (let i = 0; i < points.length; i += 1) {
          const p = points[i];
          const meta = insertedMeta[i] || {};
          nodes.push({
            id: i,
            p: { x: p.x, y: p.y },
            left: i > 0 ? i - 1 : null,
            right: i < points.length - 1 ? i + 1 : null,
            rule: (pointRule && pointRule[i]) || meta.rule || "carry",
            axisId: pointAxis && pointAxis[i] != null ? pointAxis[i] : meta.axisId ?? null,
            parentAxisId: meta.parentAxisId ?? null,
            base: meta.base ? { x: meta.base.x, y: meta.base.y } : null,
            edgeBase: meta.edgeBase ? { x: meta.edgeBase.x, y: meta.edgeBase.y } : null,
            edge: meta.edge ?? null,
          });
        }
        return nodes;
      }

      function readParams() {
        const params = {
          position: parseFloat(ui.position.value),
          intensity: parseFloat(ui.intensity.value),
          angle: parseFloat(ui.angle.value),
          contractionPosition: parseFloat(ui.contractionPosition.value),
          contractionIntensity: parseFloat(ui.contractionIntensity.value),
          minEdgeLength: parseFloat(ui.minEdgeLength.value),
          showConstructionPoints: ui.showConstructionPoints.checked,
          showConstructionLines: ui.showConstructionLines.checked,
          showAxis: ui.showAxis.checked,
          showPolarityPoints: ui.showPolarityPoints.checked,
          stopNegNeg: ui.stopNegNeg.checked,
          jitter: ui.jitter.checked,
          jitterAmount: parseFloat(ui.jitterAmount.value),
        };
        return params;
      }

      function updateReadouts(params) {
        ui.positionVal.textContent = params.position.toFixed(2);
        ui.intensityVal.textContent = params.intensity.toFixed(2);
        ui.angleVal.textContent = params.angle.toFixed(0);
        ui.contractionPositionVal.textContent = params.contractionPosition.toFixed(2);
        ui.contractionIntensityVal.textContent = params.contractionIntensity.toFixed(2);
        ui.minEdgeLengthVal.textContent = params.minEdgeLength.toFixed(2);
        ui.jitterVal.textContent = params.jitterAmount.toFixed(2);
        ui.jitterAmount.disabled = !params.jitter;
      }

      function generateSteps(params) {
        const steps = [];
        const baseLine = [
          { x: 0, y: -0.5 },
          { x: 0, y: 0.5 },
        ];
        const maxAutoSteps = 120;
        const rootAxisDir = normalizeVec({
          x: baseLine[1].x - baseLine[0].x,
          y: baseLine[1].y - baseLine[0].y,
        });
        let axisState = {
          axes: [
            {
              id: 0,
              parent: null,
              anchor: { x: baseLine[0].x, y: baseLine[0].y },
              tip: { x: baseLine[1].x, y: baseLine[1].y },
              dir: rootAxisDir,
            },
          ],
          segmentAxis: [0],
        };
        const initialPointRule = ["seed", "seed"];
        const initialPointAxis = [0, 0];
        const initialNodes = buildNodeGraph(baseLine, initialPointRule, initialPointAxis, []);
        steps.push({
          points: baseLine,
          pointPolarity: [-1, 1],
          pointAxis: initialPointAxis,
          pointRule: initialPointRule,
          segmentOrient: [1],
          segmentPolarity: [1],
          segmentActive: [true],
          segmentAxis: axisState.segmentAxis,
          construction: { bases: [], links: [], inserted: [] },
          prevPoints: null,
          meta: {
            type: "initial",
            center: null,
            targets: [],
            axisLinks: [],
            polarity: { pos: [{ ...baseLine[1] }], neg: [{ ...baseLine[0] }], posLinks: [] },
            graph: { nodes: initialNodes, axes: snapshotAxes(axisState.axes) },
          },
        });

        let stepIndex = 1;
        while (stepIndex <= maxAutoSteps) {
          const prev = steps[steps.length - 1];
          const expansion = expandPolyline(
            prev.points,
            prev.segmentActive,
            prev.segmentOrient,
            prev.segmentPolarity,
            prev.pointPolarity,
            prev.pointAxis,
            prev.pointRule,
            params,
            stepIndex,
            prev.meta.polarity,
            axisState
          );
          axisState = expansion.axisState;
          steps.push({
            points: expansion.points,
            pointPolarity: expansion.pointPolarity,
            pointAxis: expansion.pointAxis,
            pointRule: expansion.pointRule,
            segmentOrient: expansion.segmentOrient,
            segmentPolarity: expansion.segmentPolarity,
            segmentActive: expansion.segmentActive,
            segmentAxis: expansion.segmentAxis,
            construction: expansion.construction,
            prevPoints: prev.points,
            meta: expansion.meta,
          });
          const expansionCount = expansion.meta?.expansionPoints?.length ?? 0;
          if (expansionCount === 0) break;

          stepIndex += 1;
          if (stepIndex > maxAutoSteps) break;
          const prevAfterExpansion = steps[steps.length - 1];
          const contraction = contractPolyline(
            prevAfterExpansion.points,
            prevAfterExpansion.segmentActive,
            prevAfterExpansion.segmentOrient,
            prevAfterExpansion.segmentPolarity,
            prevAfterExpansion.pointPolarity,
            prevAfterExpansion.pointAxis,
            prevAfterExpansion.pointRule,
            params,
            stepIndex,
            prevAfterExpansion.meta.targets,
            prevAfterExpansion.meta.center,
            prevAfterExpansion.meta.polarity,
            axisState
          );
          axisState = contraction.axisState;
          steps.push({
            points: contraction.points,
            pointPolarity: contraction.pointPolarity,
            pointAxis: contraction.pointAxis,
            pointRule: contraction.pointRule,
            segmentOrient: contraction.segmentOrient,
            segmentPolarity: contraction.segmentPolarity,
            segmentActive: contraction.segmentActive,
            segmentAxis: contraction.segmentAxis,
            construction: contraction.construction,
            prevPoints: prevAfterExpansion.points,
            meta: contraction.meta,
          });
          stepIndex += 1;
        }

        return steps;
      }

      function expandPolyline(
        points,
        segmentActive,
        segmentOrient,
        segmentPolarity,
        pointPolarity,
        pointAxis,
        pointRule,
        params,
        stepIndex,
        prevPolarity,
        axisState
      ) {
        if (!points || points.length < 2) {
          return {
            points: points ? points.slice() : [],
            pointPolarity: pointPolarity ? pointPolarity.slice() : [],
            pointAxis: pointAxis ? pointAxis.slice() : [],
            pointRule: pointRule ? pointRule.slice() : [],
            segmentOrient: segmentOrient ? segmentOrient.slice() : [],
            segmentPolarity: segmentPolarity ? segmentPolarity.slice() : [],
            segmentActive: segmentActive ? segmentActive.slice() : [],
            segmentAxis: axisState?.segmentAxis ? axisState.segmentAxis.slice() : [],
            construction: { bases: [], links: [], inserted: [] },
            axisState: axisState || { axes: [], segmentAxis: [] },
            meta: {
              type: "expansion",
              center: { x: 0, y: 0 },
              expansionPoints: [],
              targets: [],
              axisLinks: [],
              graph: { nodes: [], axes: snapshotAxes(axisState?.axes || []) },
              polarity: {
                pos: prevPolarity?.pos ? prevPolarity.pos.slice() : [],
                neg: prevPolarity?.neg ? prevPolarity.neg.slice() : [],
                posLinks: prevPolarity?.posLinks ? prevPolarity.posLinks.slice() : [],
              },
              contractionLinks: [],
            },
          };
        }

        const newPoints = [points[0]];
        const polIn =
          pointPolarity && pointPolarity.length === points.length
            ? pointPolarity
            : new Array(points.length).fill(0);
        const pointAxisIn =
          pointAxis && pointAxis.length === points.length
            ? pointAxis
            : new Array(points.length).fill(null);
        const pointRuleIn =
          pointRule && pointRule.length === points.length
            ? pointRule
            : new Array(points.length).fill("carry");
        const activeIn =
          segmentActive && segmentActive.length === points.length - 1
            ? segmentActive
            : new Array(points.length - 1).fill(true);
        const orientIn =
          segmentOrient && segmentOrient.length === points.length - 1
            ? segmentOrient
            : new Array(points.length - 1).fill(1);
        const sideIn =
          segmentPolarity && segmentPolarity.length === points.length - 1
            ? segmentPolarity
            : new Array(points.length - 1).fill(1);
        const segmentAxisIn =
          axisState && axisState.segmentAxis && axisState.segmentAxis.length === points.length - 1
            ? axisState.segmentAxis
            : new Array(points.length - 1).fill(0);
        const axesIn = axisState && axisState.axes ? axisState.axes : [];
        const axes = axesIn.slice();
        let parentAxis = axes[0];
        const newPolarity = [polIn[0] ?? 0];
        const newPointAxis = [pointAxisIn[0] ?? null];
        const newPointRule = [pointRuleIn[0] ?? "carry"];
        const newSegmentOrient = [];
        const newSegmentPolarity = [];
        const newSegmentActive = [];
        const newSegmentAxis = [];
        const tBase = clamp(params.position, 0, 1);
        const intensity = clamp(params.intensity, 0, 1);
        const angleBase = (params.angle * Math.PI) / 180;
        const jitterAmount = clamp(params.jitterAmount, 0, 0.5);
        const construction = { bases: [], links: [], inserted: [] };
        const expansionPoints = [];
        const targets = [];
        const expansionLinks = [];
        const axisLinks = [];
        const insertedMeta = [];

        for (let i = 0; i < points.length - 1; i += 1) {
          const p0 = points[i];
          const p1 = points[i + 1];
          const pol0 = polIn[i] ?? 0;
          const pol1 = polIn[i + 1] ?? 0;
          const orient = segmentOrientation(pol0, pol1, orientIn[i] ?? 1);
          const side = sideIn[i] ?? 1;
          let parentAxisId = null;
          const isNegNeg = pol0 < 0 && pol1 < 0;
          if (isNegNeg) {
            if (pointAxisIn[i] != null) {
              parentAxisId = pointAxisIn[i];
            } else if (pointAxisIn[i + 1] != null) {
              parentAxisId = pointAxisIn[i + 1];
            }
          }
          const leftRule = pointRuleIn[i];
          const rightRule = pointRuleIn[i + 1];
          if (leftRule === "E" && rightRule !== "E") {
            parentAxisId = pointAxisIn[i];
          } else if (rightRule === "E" && leftRule !== "E") {
            parentAxisId = pointAxisIn[i + 1];
          } else if (leftRule === "E" && rightRule === "E") {
            parentAxisId = pointAxisIn[i] ?? pointAxisIn[i + 1];
          }
          if (parentAxisId == null) {
            if ((pol0 ?? 0) > 0 && pointAxisIn[i] != null) {
              parentAxisId = pointAxisIn[i];
            } else if ((pol1 ?? 0) > 0 && pointAxisIn[i + 1] != null) {
              parentAxisId = pointAxisIn[i + 1];
            } else {
              parentAxisId = segmentAxisIn[i] ?? 0;
            }
          }
          parentAxis = axes[parentAxisId] || axes[0];
          const dx = p1.x - p0.x;
          const dy = p1.y - p0.y;
          const len = Math.hypot(dx, dy);
          const isActive = activeIn[i] ?? true;
          const stopEdge = params.stopNegNeg && pol0 < 0 && pol1 < 0;

          if (len < 1e-9) {
            newPoints.push({ x: p0.x, y: p0.y });
            newPoints.push({ x: p1.x, y: p1.y });
            newPolarity.push(pol0, pol1);
            newPointAxis.push(pointAxisIn[i] ?? parentAxisId, pointAxisIn[i + 1] ?? parentAxisId);
            newPointRule.push(pointRuleIn[i] ?? "carry", pointRuleIn[i + 1] ?? "carry");
            newSegmentOrient.push(orient, orient);
            newSegmentPolarity.push(side, side);
            newSegmentActive.push(false, false);
            newSegmentAxis.push(parentAxisId, parentAxisId);
            continue;
          }

          if (!isActive || stopEdge) {
            if (stopEdge) {
              const leftIsC = pointRuleIn[i] === "C";
              const rightIsC = pointRuleIn[i + 1] === "C";
              if (leftIsC && pointAxisIn[i] != null) {
                parentAxisId = pointAxisIn[i];
              } else if (rightIsC && pointAxisIn[i + 1] != null) {
                parentAxisId = pointAxisIn[i + 1];
              }
            }
            newPoints.push(p1);
            newPolarity.push(pol1);
            newPointAxis.push(pointAxisIn[i + 1] ?? parentAxisId);
            newPointRule.push(pointRuleIn[i + 1] ?? "carry");
            newSegmentOrient.push(orient);
            newSegmentPolarity.push(side);
            newSegmentActive.push(false);
            newSegmentAxis.push(parentAxisId);
            targets.push(null);
            continue;
          }

          let t = orient === -1 ? 1 - tBase : tBase;
          let angle = angleBase;
          let magnitude = len * intensity;

          if (params.jitter) {
            const seedBase = (stepIndex + 1) * 9283.123 + (i + 1) * 137.57;
            const j1 = rand(seedBase + 0.17) - 0.5;
            const j2 = rand(seedBase + 3.49) - 0.5;
            const j3 = rand(seedBase + 8.91) - 0.5;
            t = clamp(t + j1 * jitterAmount, 0, 1);
            angle += j2 * jitterAmount * Math.PI;
            magnitude *= 1 + j3 * jitterAmount;
          }

          const baseEdge = { x: p0.x + dx * t, y: p0.y + dy * t };
          const dirRaw = { x: dx / len, y: dy / len };
          let outward = { x: dirRaw.y, y: -dirRaw.x };
          if (side < 0) {
            outward = { x: -outward.x, y: -outward.y };
          }
          let perp = rotateVec(outward, angle * orient);
          if (perp.x * outward.x + perp.y * outward.y < 0) {
            perp = { x: -perp.x, y: -perp.y };
          }

          const baseAxis = projectPointToAxis(baseEdge, parentAxis);
          const pNew = {
            x: baseAxis.x + perp.x * magnitude,
            y: baseAxis.y + perp.y * magnitude,
          };
          const axisAnchor = { x: baseAxis.x, y: baseAxis.y };
          const axisDir = normalizeVec(
            { x: pNew.x - axisAnchor.x, y: pNew.y - axisAnchor.y },
            parentAxis?.dir || { x: 0, y: 1 }
          );
          const axisId = axes.length;
          axes.push({
            id: axisId,
            parent: parentAxis ? parentAxis.id : null,
            anchor: { x: axisAnchor.x, y: axisAnchor.y },
            tip: { x: pNew.x, y: pNew.y },
            dir: axisDir,
          });
          axisLinks.push({ a: axisAnchor, b: pNew });

          construction.bases.push(baseAxis);
          construction.links.push({ a: baseAxis, b: pNew });
          construction.inserted.push(pNew);
          expansionPoints.push(pNew);
          expansionLinks.push({ a: baseAxis, b: pNew });
          targets.push(baseAxis, baseAxis);

          newPoints.push(pNew);
          newPoints.push(p1);
          const newPointIndex = newPoints.length - 2;
          insertedMeta[newPointIndex] = {
            rule: "E",
            axisId,
            parentAxisId: parentAxis ? parentAxis.id : null,
            base: { x: baseAxis.x, y: baseAxis.y },
            edgeBase: { x: baseEdge.x, y: baseEdge.y },
            edge: { a: i, b: i + 1 },
          };
          newPolarity.push(1, pol1);
          newPointAxis.push(axisId);
          newPointRule.push("E");
          const orientA = segmentOrientation(pol0, 1, orient);
          const orientB = segmentOrientation(1, pol1, orient);
          newSegmentOrient.push(orientA, orientB);
          newSegmentPolarity.push(side, side);
          newSegmentActive.push(true, true);
          newSegmentAxis.push(axisId, axisId);
          newPointAxis.push(pointAxisIn[i + 1] ?? parentAxisId);
          newPointRule.push(pointRuleIn[i + 1] ?? "carry");
        }

        const basePoints = construction.bases;
        const center =
          basePoints.length > 0
            ? basePoints.reduce(
                (acc, p) => ({ x: acc.x + p.x, y: acc.y + p.y }),
                { x: 0, y: 0 }
              )
            : { x: 0, y: 0 };
        if (basePoints.length > 0) {
          center.x /= basePoints.length;
          center.y /= basePoints.length;
        }

        return {
          points: newPoints,
          pointPolarity: newPolarity,
          pointAxis: newPointAxis,
          pointRule: newPointRule,
          segmentOrient: newSegmentOrient,
          segmentPolarity: newSegmentPolarity,
          segmentActive: newSegmentActive,
          segmentAxis: newSegmentAxis,
          construction,
          axisState: { axes, segmentAxis: newSegmentAxis },
          meta: {
            type: "expansion",
            center,
            expansionPoints,
            targets,
            axisLinks,
            graph: {
              nodes: buildNodeGraph(newPoints, newPointRule, newPointAxis, insertedMeta),
              axes: snapshotAxes(axes),
            },
            polarity: {
              pos: (prevPolarity?.pos ? prevPolarity.pos.slice() : []).concat(expansionPoints),
              neg: prevPolarity?.neg ? prevPolarity.neg.slice() : [],
              posLinks: (prevPolarity?.posLinks ? prevPolarity.posLinks.slice() : []).concat(
                expansionLinks
              ),
            },
            contractionLinks: [],
          },
        };
      }

      function contractPolyline(
        points,
        segmentActive,
        segmentOrient,
        segmentPolarity,
        pointPolarity,
        pointAxis,
        pointRule,
        params,
        stepIndex,
        targets,
        center,
        prevPolarity,
        axisState
      ) {
        if (!points || points.length < 2) {
          return {
            points: points ? points.slice() : [],
            pointPolarity: pointPolarity ? pointPolarity.slice() : [],
            pointAxis: pointAxis ? pointAxis.slice() : [],
            pointRule: pointRule ? pointRule.slice() : [],
            segmentOrient: segmentOrient ? segmentOrient.slice() : [],
            segmentPolarity: segmentPolarity ? segmentPolarity.slice() : [],
            segmentActive: segmentActive ? segmentActive.slice() : [],
            segmentAxis: axisState?.segmentAxis ? axisState.segmentAxis.slice() : [],
            construction: { bases: [], links: [], inserted: [] },
            axisState: axisState || { axes: [], segmentAxis: [] },
            meta: {
              type: "contraction",
              center: center || { x: 0, y: 0 },
              targets: [],
              axisLinks: [],
              graph: { nodes: [], axes: snapshotAxes(axisState?.axes || []) },
              polarity: {
                pos: prevPolarity?.pos ? prevPolarity.pos.slice() : [],
                neg: prevPolarity?.neg ? prevPolarity.neg.slice() : [],
                posLinks: prevPolarity?.posLinks ? prevPolarity.posLinks.slice() : [],
              },
              contractionLinks: [],
            },
          };
        }

        const fallback = center || { x: 0, y: 0 };
        const newPoints = [points[0]];
        const polIn =
          pointPolarity && pointPolarity.length === points.length
            ? pointPolarity
            : new Array(points.length).fill(0);
        const pointAxisIn =
          pointAxis && pointAxis.length === points.length
            ? pointAxis
            : new Array(points.length).fill(null);
        const pointRuleIn =
          pointRule && pointRule.length === points.length
            ? pointRule
            : new Array(points.length).fill("carry");
        const activeIn =
          segmentActive && segmentActive.length === points.length - 1
            ? segmentActive
            : new Array(points.length - 1).fill(true);
        const orientIn =
          segmentOrient && segmentOrient.length === points.length - 1
            ? segmentOrient
            : new Array(points.length - 1).fill(1);
        const sideIn =
          segmentPolarity && segmentPolarity.length === points.length - 1
            ? segmentPolarity
            : new Array(points.length - 1).fill(1);
        const segmentAxisIn =
          axisState && axisState.segmentAxis && axisState.segmentAxis.length === points.length - 1
            ? axisState.segmentAxis
            : new Array(points.length - 1).fill(0);
        const axesIn = axisState && axisState.axes ? axisState.axes : [];
        const axes = axesIn.slice();
        const newPolarity = [polIn[0] ?? 0];
        const newPointAxis = [pointAxisIn[0] ?? null];
        const newPointRule = [pointRuleIn[0] ?? "carry"];
        const newSegmentOrient = [];
        const newSegmentPolarity = [];
        const newSegmentActive = [];
        const newSegmentAxis = [];
        const tBase = clamp(params.contractionPosition, 0, 1);
        const intensity = clamp(params.contractionIntensity, 0, 1);
        const construction = { bases: [], links: [], inserted: [] };
        const contractionPoints = [];
        const contractionLinks = [];
        const axisLinks = [];
        const insertedMeta = [];

        for (let i = 0; i < points.length - 1; i += 1) {
          const p0 = points[i];
          const p1 = points[i + 1];
          const pol0 = polIn[i] ?? 0;
          const pol1 = polIn[i + 1] ?? 0;
          const orient = segmentOrientation(pol0, pol1, orientIn[i] ?? 1);
          const side = sideIn[i] ?? 1;
          let parentAxisId = null;
          const isNegNeg = pol0 < 0 && pol1 < 0;
          if (isNegNeg) {
            if (pointAxisIn[i] != null) {
              parentAxisId = pointAxisIn[i];
            } else if (pointAxisIn[i + 1] != null) {
              parentAxisId = pointAxisIn[i + 1];
            }
          }
          const leftRule = pointRuleIn[i];
          const rightRule = pointRuleIn[i + 1];
          if (leftRule === "E" && rightRule !== "E") {
            parentAxisId = pointAxisIn[i];
          } else if (rightRule === "E" && leftRule !== "E") {
            parentAxisId = pointAxisIn[i + 1];
          } else if (leftRule === "E" && rightRule === "E") {
            parentAxisId = pointAxisIn[i] ?? pointAxisIn[i + 1];
          }
          if (parentAxisId == null) {
            if ((pol0 ?? 0) > 0 && pointAxisIn[i] != null) {
              parentAxisId = pointAxisIn[i];
            } else if ((pol1 ?? 0) > 0 && pointAxisIn[i + 1] != null) {
              parentAxisId = pointAxisIn[i + 1];
            } else {
              parentAxisId = segmentAxisIn[i] ?? 0;
            }
          }
          const parentAxis = axes[parentAxisId] || axes[0];
          const dx = p1.x - p0.x;
          const dy = p1.y - p0.y;
          const len = Math.hypot(dx, dy);
          const minEdgeLength = Math.max(0, params.minEdgeLength ?? 0);
          const lengthActive = len > minEdgeLength;
          const isActive = (activeIn[i] ?? true) && lengthActive;

          if (len < 1e-9) {
            newPoints.push({ x: p0.x, y: p0.y });
            newPoints.push({ x: p1.x, y: p1.y });
            newPolarity.push(pol0, pol1);
            newPointAxis.push(pointAxisIn[i] ?? parentAxisId, pointAxisIn[i + 1] ?? parentAxisId);
            newPointRule.push(pointRuleIn[i] ?? "carry", pointRuleIn[i + 1] ?? "carry");
            newSegmentOrient.push(orient, orient);
            newSegmentPolarity.push(side, side);
            newSegmentActive.push(false, false);
            newSegmentAxis.push(parentAxisId, parentAxisId);
            continue;
          }

          if (!isActive) {
            newPoints.push(p1);
            newPolarity.push(pol1);
            newPointAxis.push(pointAxisIn[i + 1] ?? parentAxisId);
            newPointRule.push(pointRuleIn[i + 1] ?? "carry");
            newSegmentOrient.push(orient);
            newSegmentPolarity.push(side);
            newSegmentActive.push(false);
            newSegmentAxis.push(parentAxisId);
            continue;
          }

          const base = { x: p0.x + dx * tBase, y: p0.y + dy * tBase };
          const target = targets && targets[i] ? targets[i] : fallback;
          const toCenter = { x: target.x - base.x, y: target.y - base.y };
          const pNew = {
            x: base.x + toCenter.x * intensity,
            y: base.y + toCenter.y * intensity,
          };
          const axisAnchor = target;
          const axisDir = normalizeVec(
            { x: pNew.x - axisAnchor.x, y: pNew.y - axisAnchor.y },
            parentAxis?.dir || { x: 0, y: 1 }
          );
          const axisId = axes.length;
          axes.push({
            id: axisId,
            parent: parentAxis ? parentAxis.id : null,
            anchor: { x: axisAnchor.x, y: axisAnchor.y },
            tip: { x: pNew.x, y: pNew.y },
            dir: axisDir,
          });

          construction.bases.push(base);
          construction.links.push({ a: base, b: pNew });
          construction.inserted.push(pNew);
          contractionPoints.push(pNew);
          contractionLinks.push({ a: pNew, b: target });
          newPoints.push(pNew);
          newPoints.push(p1);
          const newPointIndex = newPoints.length - 2;
          insertedMeta[newPointIndex] = {
            rule: "C",
            axisId,
            parentAxisId,
            base: { x: base.x, y: base.y },
            edge: { a: i, b: i + 1 },
          };
          newPolarity.push(-1, pol1);
          newPointAxis.push(axisId);
          newPointRule.push("C");
          const orientA = segmentOrientation(pol0, -1, orient);
          const orientB = segmentOrientation(-1, pol1, orient);
          newSegmentOrient.push(orientA, orientB);
          newSegmentPolarity.push(side, side);
          newSegmentActive.push(true, true);
          newSegmentAxis.push(axisId, axisId);
          newPointAxis.push(pointAxisIn[i + 1] ?? parentAxisId);
          newPointRule.push(pointRuleIn[i + 1] ?? "carry");
        }

        return {
          points: newPoints,
          pointPolarity: newPolarity,
          pointAxis: newPointAxis,
          pointRule: newPointRule,
          segmentOrient: newSegmentOrient,
          segmentPolarity: newSegmentPolarity,
          segmentActive: newSegmentActive,
          segmentAxis: newSegmentAxis,
          construction,
          axisState: { axes, segmentAxis: newSegmentAxis },
          meta: {
            type: "contraction",
            center: fallback,
            targets: targets || [],
            axisLinks,
            graph: {
              nodes: buildNodeGraph(newPoints, newPointRule, newPointAxis, insertedMeta),
              axes: snapshotAxes(axes),
            },
            polarity: {
              pos: prevPolarity?.pos ? prevPolarity.pos.slice() : [],
              neg: (prevPolarity?.neg ? prevPolarity.neg.slice() : []).concat(contractionPoints),
              posLinks: prevPolarity?.posLinks ? prevPolarity.posLinks.slice() : [],
            },
            contractionLinks,
          },
        };
      }

      function computeBounds(points) {
        let minX = Infinity;
        let minY = Infinity;
        let maxX = -Infinity;
        let maxY = -Infinity;

        for (const p of points) {
          if (!p) continue;
          minX = Math.min(minX, p.x);
          minY = Math.min(minY, p.y);
          maxX = Math.max(maxX, p.x);
          maxY = Math.max(maxY, p.y);
        }

        return { minX, minY, maxX, maxY };
      }

      function fitToCanvas(points, width, height, padding, symmetric = false) {
        let { minX, minY, maxX, maxY } = computeBounds(points);

        if (!Number.isFinite(minX)) {
          minX = -1;
          minY = -1;
          maxX = 1;
          maxY = 1;
        }

        if (symmetric) {
          const maxAbsX = Math.max(Math.abs(minX), Math.abs(maxX), 1e-6);
          const maxAbsY = Math.max(Math.abs(minY), Math.abs(maxY), 1e-6);
          minX = -maxAbsX;
          maxX = maxAbsX;
          minY = -maxAbsY;
          maxY = maxAbsY;
        }

        const dx = Math.max(1e-6, maxX - minX);
        const dy = Math.max(1e-6, maxY - minY);
        const scale = Math.min((width - padding * 2) / dx, (height - padding * 2) / dy);
        const cx = (minX + maxX) / 2;
        const cy = (minY + maxY) / 2;

        return { scale, cx, cy, width, height };
      }

      function fixedAxisTransform(width, height, padding) {
        const scale = (height - padding * 2) / BASE_AXIS_LENGTH;
        return { scale, cx: 0, cy: 0, width, height };
      }

      function worldToCanvas(p, t) {
        const x = (p.x - t.cx) * t.scale + t.width / 2;
        const y = (-(p.y - t.cy)) * t.scale + t.height / 2;
        return { x, y };
      }

      function drawStepToContext(ctx, step, params, size, padding, isExport = false) {
        ctx.clearRect(0, 0, size, size);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, size, size);

        const points = step.points;
        if (!points || points.length < 2) return;

        const transform = fixedAxisTransform(size, size, padding);
        const style = isExport
          ? {
              mainStroke: "rgb(0, 0, 0)",
              prevStroke: "rgb(160, 160, 160)",
              constructionStroke: "rgb(120, 120, 120)",
              baseFill: "rgb(0, 0, 0)",
              centerFill: "rgb(0, 0, 0)",
              posFill: "rgb(208, 64, 50)",
              negFill: "rgb(29, 111, 66)",
              mainWidth: 2.2,
              prevWidth: 1.2,
              constructionWidth: 1.0,
              axisStroke: "rgba(0, 0, 0, 0.2)",
              axisWidth: 1.1,
              baseRadius: 3.2,
              centerRadius: 3.4,
              polarityRadius: 3.6,
            }
          : {
              mainStroke: "#111111",
              prevStroke: "rgba(0, 0, 0, 0.25)",
              constructionStroke: "rgba(0, 0, 0, 0.45)",
              baseFill: "#111111",
              centerFill: "#111111",
              posFill: "#d04032",
              negFill: "#1d6f42",
              mainWidth: 1.2,
              prevWidth: 0.8,
              constructionWidth: 0.9,
              axisStroke: "rgba(0, 0, 0, 0.2)",
              axisWidth: 0.9,
              baseRadius: 2.4,
              centerRadius: 2.6,
              polarityRadius: 2.8,
            };

        if (params.showAxis) {
          ctx.strokeStyle = style.axisStroke;
          ctx.lineWidth = style.axisWidth;
          ctx.beginPath();
          const axisTop = worldToCanvas({ x: 0, y: 0.5 }, transform);
          const axisBottom = worldToCanvas({ x: 0, y: -0.5 }, transform);
          ctx.moveTo(axisTop.x, axisTop.y);
          ctx.lineTo(axisBottom.x, axisBottom.y);
          ctx.stroke();

          if (step.meta && step.meta.axisLinks?.length) {
            ctx.strokeStyle = style.axisStroke;
            ctx.lineWidth = style.axisWidth;
            const linkSets = SYMMETRIC_DISPLAY
              ? [step.meta.axisLinks, mirrorSegments(step.meta.axisLinks)]
              : [step.meta.axisLinks];
            linkSets.forEach((segments) => {
              ctx.beginPath();
              for (const seg of segments) {
                const a = worldToCanvas(seg.a, transform);
                const b = worldToCanvas(seg.b, transform);
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
              }
              ctx.stroke();
            });
          }
        }

        if (step.prevPoints && step.prevPoints.length >= 2) {
          ctx.strokeStyle = style.prevStroke;
          ctx.lineWidth = style.prevWidth;
          const prevSets = SYMMETRIC_DISPLAY
            ? [step.prevPoints, mirrorPoints(step.prevPoints)]
            : [step.prevPoints];
          prevSets.forEach((pts) => {
            ctx.beginPath();
            const prevFirst = worldToCanvas(pts[0], transform);
            ctx.moveTo(prevFirst.x, prevFirst.y);
            for (let i = 1; i < pts.length; i += 1) {
              const pt = worldToCanvas(pts[i], transform);
              ctx.lineTo(pt.x, pt.y);
            }
            ctx.stroke();
          });
        }

        if (params.showConstructionPoints && step.meta) {
          const targetList = step.meta.targets && step.meta.targets.length > 0 ? step.meta.targets : [];
          const centers = targetList.length
            ? uniquePoints(targetList)
            : step.meta.center
            ? [step.meta.center]
            : [];
          if (centers.length) {
            ctx.fillStyle = style.centerFill;
            const centerSets = SYMMETRIC_DISPLAY ? centers.concat(centers.map(mirrorPoint)) : centers;
            for (const center of centerSets) {
              const c = worldToCanvas(center, transform);
              ctx.beginPath();
              ctx.arc(c.x, c.y, style.centerRadius, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }

        ctx.strokeStyle = style.mainStroke;
        ctx.lineWidth = style.mainWidth;
        const pointSets = SYMMETRIC_DISPLAY ? [points, mirrorPoints(points)] : [points];
        pointSets.forEach((pts) => {
          ctx.beginPath();
          const first = worldToCanvas(pts[0], transform);
          ctx.moveTo(first.x, first.y);
          for (let i = 1; i < pts.length; i += 1) {
            const pt = worldToCanvas(pts[i], transform);
            ctx.lineTo(pt.x, pt.y);
          }
          ctx.stroke();
        });

        if (step.construction.links.length && params.showConstructionLines) {
          ctx.strokeStyle = style.constructionStroke;
          ctx.lineWidth = style.constructionWidth;
          ctx.setLineDash([4, 3]);
          const linkSets = SYMMETRIC_DISPLAY
            ? [step.construction.links, mirrorSegments(step.construction.links)]
            : [step.construction.links];
          linkSets.forEach((segments) => {
            ctx.beginPath();
            for (const seg of segments) {
              const a = worldToCanvas(seg.a, transform);
              const b = worldToCanvas(seg.b, transform);
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
            }
            ctx.stroke();
          });
          ctx.setLineDash([]);
        }

        if (params.showConstructionLines && step.meta && step.meta.contractionLinks?.length) {
          ctx.strokeStyle = style.constructionStroke;
          ctx.lineWidth = style.constructionWidth;
          ctx.setLineDash([4, 3]);
          const linkSets = SYMMETRIC_DISPLAY
            ? [step.meta.contractionLinks, mirrorSegments(step.meta.contractionLinks)]
            : [step.meta.contractionLinks];
          linkSets.forEach((segments) => {
            ctx.beginPath();
            for (const seg of segments) {
              const a = worldToCanvas(seg.a, transform);
              const b = worldToCanvas(seg.b, transform);
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
            }
            ctx.stroke();
          });
          ctx.setLineDash([]);
        }

        if (params.showConstructionPoints) {
          ctx.fillStyle = style.baseFill;
          const baseSets = SYMMETRIC_DISPLAY
            ? step.construction.bases.concat(step.construction.bases.map(mirrorPoint))
            : step.construction.bases;
          for (const base of baseSets) {
            const pt = worldToCanvas(base, transform);
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, style.baseRadius, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        if (params.showPolarityPoints && step.meta && step.meta.polarity) {
          const posList = step.meta.polarity.pos || [];
          const negList = step.meta.polarity.neg || [];
          const posSets = SYMMETRIC_DISPLAY ? posList.concat(posList.map(mirrorPoint)) : posList;
          const negSets = SYMMETRIC_DISPLAY ? negList.concat(negList.map(mirrorPoint)) : negList;

          ctx.fillStyle = style.posFill;
          for (const p of posSets) {
            const pt = worldToCanvas(p, transform);
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, style.polarityRadius, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.fillStyle = style.negFill;
          for (const p of negSets) {
            const pt = worldToCanvas(p, transform);
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, style.polarityRadius, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        if (params.showConstructionLines && step.meta && step.meta.polarity) {
          const links = step.meta.polarity.posLinks || [];
          if (links.length) {
            ctx.strokeStyle = style.constructionStroke;
            ctx.lineWidth = style.constructionWidth;
            ctx.setLineDash([4, 3]);
            const linkSets = SYMMETRIC_DISPLAY ? [links, mirrorSegments(links)] : [links];
            linkSets.forEach((segments) => {
              ctx.beginPath();
              for (const seg of segments) {
                const a = worldToCanvas(seg.a, transform);
                const b = worldToCanvas(seg.b, transform);
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
              }
              ctx.stroke();
            });
            ctx.setLineDash([]);
          }
        }
      }

      function drawStep(canvas, step, params) {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round(TILE_SIZE * dpr);
        canvas.height = Math.round(TILE_SIZE * dpr);
        canvas.style.width = `${TILE_SIZE}px`;
        canvas.style.height = `${TILE_SIZE}px`;

        const ctx = canvas.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        drawStepToContext(ctx, step, params, TILE_SIZE, PADDING);
      }

      function renderSteps(stepPolylines, params) {
        ui.tiles.innerHTML = "";
        const startIndex = stepPolylines.length > 1 ? 1 : 0;
        stepPolylines.slice(startIndex).forEach((step, offset) => {
          const index = startIndex + offset;
          const tile = document.createElement("div");
          tile.className = "tile";

          const canvas = document.createElement("canvas");
          const label = document.createElement("div");
          label.className = "label";
          label.textContent = `Step ${index}`;

          tile.appendChild(canvas);
          tile.appendChild(label);
          ui.tiles.appendChild(tile);

          drawStep(canvas, step, params);
        });
      }

      function update() {
        const params = readParams();
        updateReadouts(params);
        const steps = generateSteps(params);
        renderSteps(steps, params);
      }

      const inputs = document.querySelectorAll("input, select");
      inputs.forEach((input) => input.addEventListener("input", update));
      window.addEventListener("resize", update);
      ui.exportSteps.addEventListener("click", () => exportSteps());

      update();

      function canvasToBlob(canvas) {
        return new Promise((resolve) => {
          canvas.toBlob((blob) => resolve(blob), "image/png");
        });
      }

      async function exportSteps() {
        const params = readParams();
        const steps = generateSteps(params);

        const offscreen = document.createElement("canvas");
        offscreen.width = EXPORT_SIZE;
        offscreen.height = EXPORT_SIZE;
        const ctx = offscreen.getContext("2d");

        const startIndex = steps.length > 1 ? 1 : 0;
        for (let i = startIndex; i < steps.length; i += 1) {
          drawStepToContext(ctx, steps[i], params, EXPORT_SIZE, EXPORT_PADDING, true);
          const blob = await canvasToBlob(offscreen);
          if (!blob) continue;
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.download = `step_${String(i).padStart(2, "0")}.png`;
          link.href = url;
          link.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          await new Promise((resolve) => setTimeout(resolve, 120));
        }
      }
    </script>
  </body>
</html>
