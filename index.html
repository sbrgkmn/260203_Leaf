<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>260203_Leaf</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Trebuchet MS", "Segoe UI", Tahoma, sans-serif;
        background: #ffffff;
        color: #111111;
      }
      .page {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 16px;
        height: 100vh;
        min-height: 0;
      }
      .title {
        font-size: 18px;
        letter-spacing: 0.2px;
        margin: 0;
      }
      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 430px;
        gap: 16px;
        min-height: 0;
        flex: 1;
      }
      .steps-pane {
        min-height: 0;
        overflow: auto;
      }
      .sidebar {
        min-height: 0;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding-right: 2px;
      }
      .final-preview {
        width: 400px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .final-preview canvas {
        width: 400px;
        height: 400px;
        border: 1px solid #111111;
        background: #ffffff;
      }
      .final-preview .label {
        font-size: 12px;
        color: #222222;
      }
      .controls {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .panel {
        border: 1px solid #111111;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: #fcfcfc;
      }
      .panel-title {
        font-size: 13px;
        font-weight: 700;
        margin: 0 0 2px 0;
        letter-spacing: 0.2px;
      }
      .control {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 13px;
      }
      .control-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .control input[type="range"] {
        width: 100%;
      }
      .control .value {
        font-variant-numeric: tabular-nums;
        min-width: 44px;
        text-align: right;
      }
      .tiles {
        display: grid;
        grid-template-columns: repeat(4, 400px);
        gap: 16px;
        align-content: start;
        padding-bottom: 12px;
      }
      .tile {
        width: 400px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .tile canvas {
        border: 1px solid #111111;
        background: #ffffff;
      }
      .tile .label {
        font-size: 12px;
        color: #222222;
      }
      .control button {
        padding: 6px 10px;
        border: 1px solid #111111;
        background: #ffffff;
        cursor: pointer;
        font-size: 12px;
      }
      @media (max-width: 1400px) {
        .page {
          height: auto;
          min-height: 0;
        }
        .workspace {
          grid-template-columns: 1fr;
        }
        .steps-pane,
        .sidebar {
          overflow: visible;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <h1 class="title">260203_Leaf</h1>

      <div class="workspace">
        <div class="steps-pane">
          <div class="tiles" id="tiles"></div>
        </div>
        <div class="sidebar">
          <div class="final-preview">
            <canvas id="finalCanvas"></canvas>
            <div class="label">Final Step</div>
          </div>
          <div class="controls">
        <div class="panel">
          <div class="panel-title">Contraction Stage</div>

          <label class="control">
            <span>Development Mode</span>
            <div class="control-row">
              <select id="contractionEdgeMode">
                <option value="all">All Edges</option>
                <option value="edge2">Edge 2</option>
                <option value="edge4">Edge 4</option>
              </select>
            </div>
          </label>

          <label class="control">
            <span>Position</span>
            <div class="control-row">
              <input id="contractionPositionA" type="range" min="0.1" max="0.9" step="0.01" value="0.28" />
              <span class="value" id="contractionPositionAVal"></span>
            </div>
          </label>

          <label class="control">
            <span>Intensity</span>
            <div class="control-row">
              <input id="contractionIntensityA" type="range" min="0.1" max="0.9" step="0.01" value="0.38" />
              <span class="value" id="contractionIntensityAVal"></span>
            </div>
          </label>

          <label class="control">
            <span>Angle</span>
            <div class="control-row">
              <input id="contractionAngleA" type="range" min="1" max="89" step="1" value="49" />
              <span class="value" id="contractionAngleAVal"></span>
            </div>
          </label>

          <label class="control">
            <span>Contract Position</span>
            <div class="control-row">
              <input id="contractionPositionB" type="range" min="0.1" max="0.9" step="0.01" value="0.50" />
              <span class="value" id="contractionPositionBVal"></span>
            </div>
          </label>

          <label class="control">
            <span>Contract Intensity</span>
            <div class="control-row">
              <input id="contractionIntensityB" type="range" min="0.1" max="0.9" step="0.01" value="0.90" />
              <span class="value" id="contractionIntensityBVal"></span>
            </div>
          </label>

          <label class="control">
            <span>Min Edge Length</span>
            <div class="control-row">
              <input id="contractionMinEdgeLength" type="range" min="0.1" max="0.9" step="0.01" value="0.10" />
              <span class="value" id="contractionMinEdgeLengthVal"></span>
            </div>
          </label>
        </div>

        <div class="panel">
          <div class="panel-title">Expansion Stage</div>

          <label class="control">
            <span>Apply Expansion Stage</span>
            <div class="control-row">
              <input id="enableExpansionStage" type="checkbox" checked />
            </div>
          </label>

          <label class="control">
            <span>Position</span>
            <div class="control-row">
              <input id="expansionPositionA" type="range" min="0.1" max="0.9" step="0.01" value="0.34" />
              <span class="value" id="expansionPositionAVal"></span>
            </div>
          </label>

          <label class="control">
            <span>Intensity</span>
            <div class="control-row">
              <input id="expansionIntensityA" type="range" min="0.1" max="0.9" step="0.01" value="0.51" />
              <span class="value" id="expansionIntensityAVal"></span>
            </div>
          </label>

          <label class="control">
            <span>Angle</span>
            <div class="control-row">
              <input id="expansionAngleA" type="range" min="1" max="89" step="1" value="63" />
              <span class="value" id="expansionAngleAVal"></span>
            </div>
          </label>

          <label class="control">
            <span>Contract Position</span>
            <div class="control-row">
              <input id="expansionPositionB" type="range" min="0.1" max="0.9" step="0.01" value="0.60" />
              <span class="value" id="expansionPositionBVal"></span>
            </div>
          </label>

          <label class="control">
            <span>Contract Intensity</span>
            <div class="control-row">
              <input id="expansionIntensityB" type="range" min="0.1" max="0.9" step="0.01" value="0.46" />
              <span class="value" id="expansionIntensityBVal"></span>
            </div>
          </label>

          <label class="control">
            <span>Min Edge Length</span>
            <div class="control-row">
              <input id="expansionMinEdgeLength" type="range" min="0.1" max="0.9" step="0.01" value="0.40" />
              <span class="value" id="expansionMinEdgeLengthVal"></span>
            </div>
          </label>
        </div>

        <div class="panel">
          <div class="panel-title">Display</div>

          <label class="control">
            <span>Show Construction Points</span>
            <div class="control-row">
              <input id="showConstructionPoints" type="checkbox" />
            </div>
          </label>

          <label class="control">
            <span>Show Form</span>
            <div class="control-row">
              <input id="showForm" type="checkbox" />
            </div>
          </label>

          <label class="control">
            <span>Form Opacity</span>
            <div class="control-row">
              <input id="showFormOpacity" type="range" min="0.20" max="1" step="0.01" value="0.35" />
              <span class="value" id="showFormOpacityVal"></span>
            </div>
          </label>

          <label class="control">
            <span>Show Construction Lines</span>
            <div class="control-row">
              <input id="showConstructionLines" type="checkbox" />
            </div>
          </label>

          <label class="control">
            <span>Show Axis</span>
            <div class="control-row">
              <input id="showAxis" type="checkbox" />
            </div>
          </label>

          <label class="control">
            <span>Show Edge IDs</span>
            <div class="control-row">
              <input id="showEdgeIds" type="checkbox" />
            </div>
          </label>

          <label class="control">
            <span>Show Triangle IDs</span>
            <div class="control-row">
              <input id="showTriangleIds" type="checkbox" />
            </div>
          </label>


          <label class="control">
            <span>Show Polarity Points</span>
            <div class="control-row">
              <input id="showPolarityPoints" type="checkbox" />
            </div>
          </label>

          <label class="control">
            <span>Stop Neg-Neg Edges</span>
            <div class="control-row">
              <input id="stopNegNeg" type="checkbox" checked />
            </div>
          </label>

          <label class="control">
            <span>Jitter</span>
            <div class="control-row">
              <input id="jitter" type="checkbox" />
            </div>
          </label>

          <label class="control">
            <span>Jitter Amount</span>
            <div class="control-row">
              <input id="jitterAmount" type="range" min="0.1" max="0.9" step="0.01" value="0.10" />
              <span class="value" id="jitterVal"></span>
            </div>
          </label>

          <label class="control">
            <span>Smoothing</span>
            <div class="control-row">
              <input id="smoothing" type="range" min="0" max="1" step="0.01" value="0" />
              <span class="value" id="smoothingVal"></span>
            </div>
          </label>

          <label class="control">
            <span>Export</span>
            <div class="control-row">
              <button id="exportSteps" type="button">Export PNG Steps</button>
            </div>
          </label>
        </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const TILE_SIZE = 400;
      const PADDING = 28;
      const EXPORT_SIZE = 640;
      const EXPORT_PADDING = 40;
      const BASE_AXIS_LENGTH = 1;
      const SYMMETRIC_DISPLAY = true;

      const ui = {
        contractionEdgeMode: document.getElementById("contractionEdgeMode"),
        contractionPositionA: document.getElementById("contractionPositionA"),
        contractionPositionAVal: document.getElementById("contractionPositionAVal"),
        contractionIntensityA: document.getElementById("contractionIntensityA"),
        contractionIntensityAVal: document.getElementById("contractionIntensityAVal"),
        contractionAngleA: document.getElementById("contractionAngleA"),
        contractionAngleAVal: document.getElementById("contractionAngleAVal"),
        contractionPositionB: document.getElementById("contractionPositionB"),
        contractionPositionBVal: document.getElementById("contractionPositionBVal"),
        contractionIntensityB: document.getElementById("contractionIntensityB"),
        contractionIntensityBVal: document.getElementById("contractionIntensityBVal"),
        contractionMinEdgeLength: document.getElementById("contractionMinEdgeLength"),
        contractionMinEdgeLengthVal: document.getElementById("contractionMinEdgeLengthVal"),
        expansionPositionA: document.getElementById("expansionPositionA"),
        expansionPositionAVal: document.getElementById("expansionPositionAVal"),
        enableExpansionStage: document.getElementById("enableExpansionStage"),
        expansionIntensityA: document.getElementById("expansionIntensityA"),
        expansionIntensityAVal: document.getElementById("expansionIntensityAVal"),
        expansionAngleA: document.getElementById("expansionAngleA"),
        expansionAngleAVal: document.getElementById("expansionAngleAVal"),
        expansionPositionB: document.getElementById("expansionPositionB"),
        expansionPositionBVal: document.getElementById("expansionPositionBVal"),
        expansionIntensityB: document.getElementById("expansionIntensityB"),
        expansionIntensityBVal: document.getElementById("expansionIntensityBVal"),
        expansionMinEdgeLength: document.getElementById("expansionMinEdgeLength"),
        expansionMinEdgeLengthVal: document.getElementById("expansionMinEdgeLengthVal"),
        showConstructionPoints: document.getElementById("showConstructionPoints"),
        showForm: document.getElementById("showForm"),
        showFormOpacity: document.getElementById("showFormOpacity"),
        showFormOpacityVal: document.getElementById("showFormOpacityVal"),
        showConstructionLines: document.getElementById("showConstructionLines"),
        showAxis: document.getElementById("showAxis"),
        showEdgeIds: document.getElementById("showEdgeIds"),
        showTriangleIds: document.getElementById("showTriangleIds"),
        showPolarityPoints: document.getElementById("showPolarityPoints"),
        stopNegNeg: document.getElementById("stopNegNeg"),
        jitter: document.getElementById("jitter"),
        jitterAmount: document.getElementById("jitterAmount"),
        jitterVal: document.getElementById("jitterVal"),
        smoothing: document.getElementById("smoothing"),
        smoothingVal: document.getElementById("smoothingVal"),
        tiles: document.getElementById("tiles"),
        finalCanvas: document.getElementById("finalCanvas"),
        exportSteps: document.getElementById("exportSteps"),
      };

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function rotateVec(v, angle) {
        const c = Math.cos(angle);
        const s = Math.sin(angle);
        return { x: v.x * c - v.y * s, y: v.x * s + v.y * c };
      }

      function normalizeVec(v, fallback = { x: 0, y: 1 }) {
        const len = Math.hypot(v.x, v.y);
        if (len < 1e-9) return { x: fallback.x, y: fallback.y };
        return { x: v.x / len, y: v.y / len };
      }

      function projectPointToAxis(p, axis) {
        if (!axis || !axis.anchor || !axis.dir) return { x: p.x, y: p.y };
        const v = { x: p.x - axis.anchor.x, y: p.y - axis.anchor.y };
        const t = v.x * axis.dir.x + v.y * axis.dir.y;
        return { x: axis.anchor.x + axis.dir.x * t, y: axis.anchor.y + axis.dir.y * t };
      }

      function segmentOrientation(polA, polB, fallback = 1) {
        if (polA < 0 && polB >= 0) return 1;
        if (polB < 0 && polA >= 0) return -1;
        return fallback || 1;
      }

      function mirrorPoint(p) {
        return { x: -p.x, y: p.y };
      }

      function mirrorPoints(points) {
        return points.map(mirrorPoint);
      }

      function mirrorSegments(segments) {
        return segments.map((seg) => ({ a: mirrorPoint(seg.a), b: mirrorPoint(seg.b) }));
      }

      function uniquePoints(points, eps = 1e-6) {
        const out = [];
        for (const p of points) {
          if (!p) continue;
          let found = false;
          for (const q of out) {
            if (Math.abs(q.x - p.x) < eps && Math.abs(q.y - p.y) < eps) {
              found = true;
              break;
            }
          }
          if (!found) out.push(p);
        }
        return out;
      }

      function rand(seed) {
        const x = Math.sin(seed) * 43758.5453;
        return x - Math.floor(x);
      }

      function selectPersistTriangles(triangles) {
        if (!triangles || triangles.length === 0) return [];
        return triangles.filter((tri) => {
          const id = tri && tri.id ? String(tri.id).toLowerCase() : "";
          return id.startsWith("xc-") || id.startsWith("hold-");
        });
      }

      function edgeIndexFromId(id) {
        if (!id) return null;
        const match = String(id).match(/-e(\d+)/i);
        if (!match) return null;
        const value = Number.parseInt(match[1], 10);
        return Number.isFinite(value) ? value : null;
      }

      function buildFormTriangles(points, targets, idPrefix = "f") {
        if (!points || points.length < 2 || !targets || targets.length !== points.length - 1) {
          return [];
        }
        const tris = [];
        for (let i = 0; i < points.length - 1; i += 1) {
          const center = targets[i];
          if (!center) continue;
          tris.push({ a: center, b: points[i], c: points[i + 1], id: `${idPrefix}-${i}` });
        }
        return tris;
      }

      function snapshotAxes(axes) {
        return axes.map((axis) => ({
          id: axis.id,
          parent: axis.parent,
          anchor: { x: axis.anchor.x, y: axis.anchor.y },
          tip: { x: axis.tip.x, y: axis.tip.y },
          dir: { x: axis.dir.x, y: axis.dir.y },
        }));
      }

      function buildNodeGraph(points, pointRule, pointAxis, insertedMeta) {
        const nodes = [];
        for (let i = 0; i < points.length; i += 1) {
          const p = points[i];
          const meta = insertedMeta[i] || {};
          nodes.push({
            id: i,
            p: { x: p.x, y: p.y },
            left: i > 0 ? i - 1 : null,
            right: i < points.length - 1 ? i + 1 : null,
            rule: (pointRule && pointRule[i]) || meta.rule || "carry",
            axisId: pointAxis && pointAxis[i] != null ? pointAxis[i] : meta.axisId ?? null,
            parentAxisId: meta.parentAxisId ?? null,
            base: meta.base ? { x: meta.base.x, y: meta.base.y } : null,
            edgeBase: meta.edgeBase ? { x: meta.edgeBase.x, y: meta.edgeBase.y } : null,
            edge: meta.edge ?? null,
          });
        }
        return nodes;
      }

      function readParams() {
        const contractionStage = {
          mode: ui.contractionEdgeMode.value,
          position: parseFloat(ui.contractionPositionA.value),
          intensity: parseFloat(ui.contractionIntensityA.value),
          angle: parseFloat(ui.contractionAngleA.value),
          contractionPosition: parseFloat(ui.contractionPositionB.value),
          contractionIntensity: parseFloat(ui.contractionIntensityB.value),
          minEdgeLength: parseFloat(ui.contractionMinEdgeLength.value),
        };
        const expansionStage = {
          position: parseFloat(ui.expansionPositionA.value),
          intensity: parseFloat(ui.expansionIntensityA.value),
          angle: parseFloat(ui.expansionAngleA.value),
          contractionPosition: parseFloat(ui.expansionPositionB.value),
          contractionIntensity: parseFloat(ui.expansionIntensityB.value),
          minEdgeLength: parseFloat(ui.expansionMinEdgeLength.value),
        };
        return {
          contractionStage,
          expansionStage,
          enableExpansionStage: ui.enableExpansionStage.checked,
          showConstructionPoints: ui.showConstructionPoints.checked,
          showForm: ui.showForm.checked,
          showFormOpacity: parseFloat(ui.showFormOpacity.value),
          showConstructionLines: ui.showConstructionLines.checked,
          showAxis: ui.showAxis.checked,
          showEdgeIds: ui.showEdgeIds.checked,
          showTriangleIds: ui.showTriangleIds.checked,
          showPolarityPoints: ui.showPolarityPoints.checked,
          stopNegNeg: ui.stopNegNeg.checked,
          jitter: ui.jitter.checked,
          jitterAmount: parseFloat(ui.jitterAmount.value),
          smoothing: parseFloat(ui.smoothing.value),
        };
      }

      function updateReadouts(params) {
        ui.contractionPositionAVal.textContent = params.contractionStage.position.toFixed(2);
        ui.contractionIntensityAVal.textContent = params.contractionStage.intensity.toFixed(2);
        ui.contractionAngleAVal.textContent = params.contractionStage.angle.toFixed(0);
        ui.contractionPositionBVal.textContent = params.contractionStage.contractionPosition.toFixed(2);
        ui.contractionIntensityBVal.textContent =
          params.contractionStage.contractionIntensity.toFixed(2);
        ui.contractionMinEdgeLengthVal.textContent =
          params.contractionStage.minEdgeLength.toFixed(2);
        ui.expansionPositionAVal.textContent = params.expansionStage.position.toFixed(2);
        ui.expansionIntensityAVal.textContent = params.expansionStage.intensity.toFixed(2);
        ui.expansionAngleAVal.textContent = params.expansionStage.angle.toFixed(0);
        ui.expansionPositionBVal.textContent = params.expansionStage.contractionPosition.toFixed(2);
        ui.expansionIntensityBVal.textContent =
          params.expansionStage.contractionIntensity.toFixed(2);
        ui.expansionMinEdgeLengthVal.textContent = params.expansionStage.minEdgeLength.toFixed(2);
        const expansionDisabled = !params.enableExpansionStage;
        ui.expansionPositionA.disabled = expansionDisabled;
        ui.expansionIntensityA.disabled = expansionDisabled;
        ui.expansionAngleA.disabled = expansionDisabled;
        ui.expansionPositionB.disabled = expansionDisabled;
        ui.expansionIntensityB.disabled = expansionDisabled;
        ui.expansionMinEdgeLength.disabled = expansionDisabled;
        ui.showFormOpacityVal.textContent = params.showFormOpacity.toFixed(2);
        ui.jitterVal.textContent = params.jitterAmount.toFixed(2);
        ui.smoothingVal.textContent = params.smoothing.toFixed(2);
        ui.jitterAmount.disabled = !params.jitter;
      }

      function generateSteps(params) {
        const steps = [];
        const persistTriangleMap = new Map();
        const attachFormTriangles = (stepObj) => {
          if (!stepObj || !stepObj.meta) return stepObj;
          const stepTag =
            stepObj.meta.stepIndex != null ? String(stepObj.meta.stepIndex) : "x";
          const typeTag = stepObj.meta.type ? stepObj.meta.type[0] : "f";
          const formPrefix = `${typeTag}${stepTag}`;
          const currentTriangles =
            stepObj.meta.type === "expansion" && stepObj.meta.expansionTriangles?.length
              ? stepObj.meta.expansionTriangles
              : buildFormTriangles(stepObj.points, stepObj.meta.targets, formPrefix);
          const persistMatches =
            stepObj.meta.type === "expansion" ? selectPersistTriangles(currentTriangles) : [];
          if (persistMatches.length) {
            persistMatches.forEach((tri) => {
              if (tri && tri.id) persistTriangleMap.set(String(tri.id), tri);
            });
          }
          const existingIds = new Set(
            currentTriangles.map((tri) => (tri && tri.id ? String(tri.id) : "")).filter(Boolean)
          );
          const merged = currentTriangles.slice();
          const developedSet =
            stepObj.meta.type === "expansion" && Array.isArray(stepObj.meta.developedEdges)
              ? new Set(stepObj.meta.developedEdges)
              : null;
          for (const [id, tri] of persistTriangleMap.entries()) {
            if (!existingIds.has(id)) {
              if (developedSet) {
                const edgeIndex = edgeIndexFromId(id);
                if (edgeIndex != null && developedSet.has(edgeIndex)) {
                  continue;
                }
              }
              merged.push(tri);
            }
          }
          stepObj.meta.formTriangles = merged;
          return stepObj;
        };
        const baseLine = [
          { x: 0, y: -0.5 },
          { x: 0, y: 0.5 },
        ];
        const maxAutoSteps = params.enableExpansionStage ? 480 : 240;
        const maxStageSteps = 120;
        const rootAxisDir = normalizeVec({
          x: baseLine[1].x - baseLine[0].x,
          y: baseLine[1].y - baseLine[0].y,
        });
        let axisState = {
          axes: [
            {
              id: 0,
              parent: null,
              anchor: { x: baseLine[0].x, y: baseLine[0].y },
              tip: { x: baseLine[1].x, y: baseLine[1].y },
              dir: rootAxisDir,
            },
          ],
          segmentAxis: [0],
        };
        const initialPointRule = ["seed", "seed"];
        const initialPointAxis = [0, 0];
        const initialNodes = buildNodeGraph(baseLine, initialPointRule, initialPointAxis, []);
        steps.push(attachFormTriangles({
          points: baseLine,
          pointPolarity: [-1, 1],
          pointAxis: initialPointAxis,
          pointRule: initialPointRule,
          segmentOrient: [1],
          segmentPolarity: [1],
          segmentActive: [true],
          segmentGroup: [0],
          segmentAxis: axisState.segmentAxis,
          construction: { bases: [], links: [], inserted: [] },
          prevPoints: null,
          meta: {
            type: "initial",
            stepIndex: 0,
            center: null,
            targets: [],
            axisLinks: [],
            polarity: { pos: [{ ...baseLine[1] }], neg: [{ ...baseLine[0] }], posLinks: [] },

              polarity: {
                pos: prevPolarity?.pos ? prevPolarity.pos.slice() : [],
                neg: prevPolarity?.neg ? prevPolarity.neg.slice() : [],
                posLinks: prevPolarity?.posLinks ? prevPolarity.posLinks.slice() : [],
              },
              contractionLinks: [],
            },
          };
        }

        const fallback = center || { x: 0, y: 0 };
        const newPoints = [points[0]];
        const polIn =
          pointPolarity && pointPolarity.length === points.length
            ? pointPolarity
            : new Array(points.length).fill(0);
        const pointAxisIn =
          pointAxis && pointAxis.length === points.length
            ? pointAxis
            : new Array(points.length).fill(null);
        const pointRuleIn =
          pointRule && pointRule.length === points.length
            ? pointRule
            : new Array(points.length).fill("carry");
        const activeIn =
          segmentActive && segmentActive.length === points.length - 1
            ? segmentActive
            : new Array(points.length - 1).fill(true);
        const groupIn =
          segmentGroup && segmentGroup.length === points.length - 1
            ? segmentGroup
            : new Array(points.length - 1).fill(0);
        const orientIn =
          segmentOrient && segmentOrient.length === points.length - 1
            ? segmentOrient
            : new Array(points.length - 1).fill(1);
        const sideIn =
          segmentPolarity && segmentPolarity.length === points.length - 1
            ? segmentPolarity
            : new Array(points.length - 1).fill(1);
        const segmentAxisIn =
          axisState && axisState.segmentAxis && axisState.segmentAxis.length === points.length - 1
            ? axisState.segmentAxis
            : new Array(points.length - 1).fill(0);
        const axesIn = axisState && axisState.axes ? axisState.axes : [];
        const axes = axesIn.slice();
        const newPolarity = [polIn[0] ?? 0];
        const newPointAxis = [pointAxisIn[0] ?? null];
        const newPointRule = [pointRuleIn[0] ?? "carry"];
        const newSegmentOrient = [];
        const newSegmentPolarity = [];
        const newSegmentActive = [];
        let newSegmentGroup = [];
        const newSegmentAxis = [];
        const tBase = clamp(params.contractionPosition, 0, 1);
        const intensity = clamp(params.contractionIntensity, 0, 1);
        const construction = { bases: [], links: [], inserted: [] };
        const contractionPoints = [];
        const contractionLinks = [];
        const nextTargets = [];
        const axisLinks = [];
        const insertedMeta = [];

        for (let i = 0; i < points.length - 1; i += 1) {
          const p0 = points[i];
          const p1 = points[i + 1];
          const pol0 = polIn[i] ?? 0;
          const pol1 = polIn[i + 1] ?? 0;
          const orient = segmentOrientation(pol0, pol1, orientIn[i] ?? 1);
          const side = sideIn[i] ?? 1;
          let parentAxisId = null;
          const isNegNeg = pol0 < 0 && pol1 < 0;
          if (isNegNeg) {
            if (pointAxisIn[i] != null) {
              parentAxisId = pointAxisIn[i];
            } else if (pointAxisIn[i + 1] != null) {
              parentAxisId = pointAxisIn[i + 1];
            }
          }
          const leftRule = pointRuleIn[i];
          const rightRule = pointRuleIn[i + 1];
          if (leftRule === "E" && rightRule !== "E") {
            parentAxisId = pointAxisIn[i];
          } else if (rightRule === "E" && leftRule !== "E") {
            parentAxisId = pointAxisIn[i + 1];
          } else if (leftRule === "E" && rightRule === "E") {
            parentAxisId = pointAxisIn[i] ?? pointAxisIn[i + 1];
          }
          if (parentAxisId == null) {
            if ((pol0 ?? 0) > 0 && pointAxisIn[i] != null) {
              parentAxisId = pointAxisIn[i];
            } else if ((pol1 ?? 0) > 0 && pointAxisIn[i + 1] != null) {
              parentAxisId = pointAxisIn[i + 1];
            } else {
              parentAxisId = segmentAxisIn[i] ?? 0;
            }
          }
          const parentAxis = axes[parentAxisId] || axes[0];
          const dx = p1.x - p0.x;
          const dy = p1.y - p0.y;
          const len = Math.hypot(dx, dy);
          const groupId = groupIn[i] ?? 0;
          const isActive = activeIn[i] ?? true;
          const rawTarget = targets && i < targets.length ? targets[i] : undefined;
          const target = rawTarget === undefined ? fallback : rawTarget;

          if (len < 1e-9) {
            newPoints.push({ x: p0.x, y: p0.y });
            newPoints.push({ x: p1.x, y: p1.y });
            newPolarity.push(pol0, pol1);
            newPointAxis.push(pointAxisIn[i] ?? parentAxisId, pointAxisIn[i + 1] ?? parentAxisId);
            newPointRule.push(pointRuleIn[i] ?? "carry", pointRuleIn[i + 1] ?? "carry");
            newSegmentOrient.push(orient, orient);
            newSegmentPolarity.push(side, side);
            newSegmentActive.push(false, false);
            newSegmentGroup.push(groupId, groupId);
            newSegmentAxis.push(parentAxisId, parentAxisId);
            nextTargets.push(target, target);
            continue;
          }

          if (!isActive) {
            newPoints.push(p1);
            newPolarity.push(pol1);
            newPointAxis.push(pointAxisIn[i + 1] ?? parentAxisId);
            newPointRule.push(pointRuleIn[i + 1] ?? "carry");
            newSegmentOrient.push(orient);
            newSegmentPolarity.push(side);
            newSegmentActive.push(false);
            newSegmentGroup.push(groupId);
            newSegmentAxis.push(parentAxisId);
            nextTargets.push(target);
            continue;
          }

          const base = { x: p0.x + dx * tBase, y: p0.y + dy * tBase };
          const toCenter = { x: target.x - base.x, y: target.y - base.y };
          const pNew = {
            x: base.x + toCenter.x * intensity,
            y: base.y + toCenter.y * intensity,
          };
          const axisAnchor = target;
          const axisDir = normalizeVec(
            { x: pNew.x - axisAnchor.x, y: pNew.y - axisAnchor.y },
            parentAxis?.dir || { x: 0, y: 1 }
          );
          const axisId = axes.length;
          axes.push({
            id: axisId,
            parent: parentAxis ? parentAxis.id : null,
            anchor: { x: axisAnchor.x, y: axisAnchor.y },
            tip: { x: pNew.x, y: pNew.y },
            dir: axisDir,
          });

          construction.bases.push(base);
          construction.links.push({ a: base, b: pNew });
          construction.inserted.push(pNew);
          contractionPoints.push(pNew);
          contractionLinks.push({ a: pNew, b: target });
          newPoints.push(pNew);
          newPoints.push(p1);
          const newPointIndex = newPoints.length - 2;
          insertedMeta[newPointIndex] = {
            rule: "C",
            axisId,
            parentAxisId,
            base: { x: base.x, y: base.y },
            edge: { a: i, b: i + 1 },
          };
          newPolarity.push(-1, pol1);
          newPointAxis.push(axisId);
          newPointRule.push("C");
          const orientA = segmentOrientation(pol0, -1, orient);
          const orientB = segmentOrientation(-1, pol1, orient);
          newSegmentOrient.push(orientA, orientB);
          newSegmentPolarity.push(side, side);
          newSegmentActive.push(true, true);
          let halfIndex = null;
          if (leftRule === "E" && rightRule !== "E") {
            halfIndex = 1;
          } else if (rightRule === "E" && leftRule !== "E") {
            halfIndex = 0;
          }
          let groupA = groupId;
          let groupB = groupId;
          if (groupId === 0) {
            groupA = 1;
            groupB = 2;
            if (halfIndex === 1) {
              [groupA, groupB] = [groupB, groupA];
            }
          } else if (groupId === 1) {
            groupA = 3;
            groupB = 4;
            if (halfIndex === 1) {
              [groupA, groupB] = [groupB, groupA];
            }
          } else if (halfIndex != null) {
            const baseIndex = halfIndex === 0 ? 1 : 3;
            groupA = baseIndex;
            groupB = baseIndex + 1;
          }
          newSegmentGroup.push(groupA, groupB);
          newSegmentAxis.push(axisId, axisId);
          nextTargets.push(target, target);
          newPointAxis.push(pointAxisIn[i + 1] ?? parentAxisId);
          newPointRule.push(pointRuleIn[i + 1] ?? "carry");
        }

        return {
          points: newPoints,
          pointPolarity: newPolarity,
          pointAxis: newPointAxis,
          pointRule: newPointRule,
          segmentOrient: newSegmentOrient,
          segmentPolarity: newSegmentPolarity,
          segmentActive: newSegmentActive,
          segmentGroup: newSegmentGroup,
          segmentAxis: newSegmentAxis,
          construction,
          axisState: { axes, segmentAxis: newSegmentAxis },
          meta: {
            type: "contraction",
            stepIndex,
            center: fallback,
            targets: nextTargets,
            axisLinks,
            graph: {
              nodes: buildNodeGraph(newPoints, newPointRule, newPointAxis, insertedMeta),
              axes: snapshotAxes(axes),
            },
            polarity: {
              pos: prevPolarity?.pos ? prevPolarity.pos.slice() : [],
              neg: (prevPolarity?.neg ? prevPolarity.neg.slice() : []).concat(contractionPoints),
              posLinks: prevPolarity?.posLinks ? prevPolarity.posLinks.slice() : [],
            },
            contractionLinks,
          },
        };
      }

      function fixedAxisTransform(width, height, padding) {
        const scale = (height - padding * 2) / BASE_AXIS_LENGTH;
        return { scale, cx: 0, cy: 0, width, height };
      }

      function worldToCanvas(p, t) {
        const x = (p.x - t.cx) * t.scale + t.width / 2;
        const y = (-(p.y - t.cy)) * t.scale + t.height / 2;
        return { x, y };
      }

      function drawBoundaryPath(ctx, points, transform, smoothing) {
        if (!points || points.length < 2) return;
        const t = clamp(smoothing ?? 0, 0, 1);
        const cpts = points.map((p) => worldToCanvas(p, transform));
        if (t <= 1e-6 || cpts.length < 3) {
          ctx.beginPath();
          ctx.moveTo(cpts[0].x, cpts[0].y);
          for (let i = 1; i < cpts.length; i += 1) {
            ctx.lineTo(cpts[i].x, cpts[i].y);
          }
          return;
        }

        ctx.beginPath();
        ctx.moveTo(cpts[0].x, cpts[0].y);
        const m01 = {
          x: (cpts[0].x + cpts[1].x) * 0.5,
          y: (cpts[0].y + cpts[1].y) * 0.5,
        };
        const firstAnchor = {
          x: cpts[0].x + (m01.x - cpts[0].x) * t,
          y: cpts[0].y + (m01.y - cpts[0].y) * t,
        };
        ctx.lineTo(firstAnchor.x, firstAnchor.y);
        for (let i = 1; i < cpts.length - 1; i += 1) {
          const ctrl = cpts[i];
          const mid = {
            x: (cpts[i].x + cpts[i + 1].x) * 0.5,
            y: (cpts[i].y + cpts[i + 1].y) * 0.5,
          };
          const end = {
            x: cpts[i].x + (mid.x - cpts[i].x) * t,
            y: cpts[i].y + (mid.y - cpts[i].y) * t,
          };
          ctx.quadraticCurveTo(ctrl.x, ctrl.y, end.x, end.y);
        }
        const last = cpts[cpts.length - 1];
        ctx.lineTo(last.x, last.y);
      }

      function drawFormTriangles(ctx, triangles, transform, mirrorAll = false) {
        if (!triangles || triangles.length === 0) return;
        ctx.beginPath();
        for (const tri of triangles) {
          const a = mirrorAll ? mirrorPoint(tri.a) : tri.a;
          let b = mirrorAll ? mirrorPoint(tri.b) : tri.b;
          let c = mirrorAll ? mirrorPoint(tri.c) : tri.c;
          const area2 = (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
          if (area2 < 0) {
            const tmp = b;
            b = c;
            c = tmp;
          }
          const pa = worldToCanvas(a, transform);
          const pb = worldToCanvas(b, transform);
          const pc = worldToCanvas(c, transform);
          ctx.moveTo(pa.x, pa.y);
          ctx.lineTo(pb.x, pb.y);
          ctx.lineTo(pc.x, pc.y);
          ctx.closePath();
        }
      }

      function triangleCentroid(tri) {
        return {
          x: (tri.a.x + tri.b.x + tri.c.x) / 3,
          y: (tri.a.y + tri.b.y + tri.c.y) / 3,
        };
      }

      function fillFormTriangles(ctx, triangles, transform, mirrorAll = false) {
        drawFormTriangles(ctx, triangles, transform, mirrorAll);
        ctx.fill();
      }

      function strokeFormTriangles(ctx, triangles, transform, mirrorAll = false) {
        drawFormTriangles(ctx, triangles, transform, mirrorAll);
        ctx.stroke();
      }

      function drawFormLayer(ctx, step, points, transform, style, edgesOnly = false, showIds = false) {
        const stepTag = step?.meta?.stepIndex != null ? String(step.meta.stepIndex) : "x";
        const typeTag = step?.meta?.type ? step.meta.type[0] : "f";
        const formPrefix = `${typeTag}${stepTag}`;
        const currentTriangles = buildFormTriangles(points, step?.meta?.targets, formPrefix);
        const formTriangles = step?.meta?.formTriangles;
        const fillTriangles = formTriangles && formTriangles.length ? formTriangles : currentTriangles;
        const strokeTriangles = fillTriangles;
        if (!fillTriangles || fillTriangles.length === 0) return;
        const outlineStroke = "rgba(0, 0, 0, 0.5)";
        const outlineWidth = 0.7;
        if (!edgesOnly) {
          ctx.fillStyle = style.formFill;
        }
        if (SYMMETRIC_DISPLAY) {
          if (!edgesOnly) {
            fillFormTriangles(ctx, fillTriangles, transform, false);
            fillFormTriangles(ctx, fillTriangles, transform, true);
          }
          if (strokeTriangles && strokeTriangles.length > 0) {
            ctx.strokeStyle = outlineStroke;
            ctx.lineWidth = outlineWidth;
            strokeFormTriangles(ctx, strokeTriangles, transform, false);
            strokeFormTriangles(ctx, strokeTriangles, transform, true);
          }
        } else {
          if (!edgesOnly) {
            fillFormTriangles(ctx, fillTriangles, transform, false);
          }
          if (strokeTriangles && strokeTriangles.length > 0) {
            ctx.strokeStyle = outlineStroke;
            ctx.lineWidth = outlineWidth;
            strokeFormTriangles(ctx, strokeTriangles, transform, false);
          }
        }

        if (showIds) {
          ctx.fillStyle = "rgba(10, 10, 10, 0.8)";
          ctx.font = "10px Trebuchet MS, Segoe UI, Tahoma, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          for (const tri of fillTriangles) {
            const id = tri.id != null ? String(tri.id) : "";
            if (!id) continue;
            const centroid = triangleCentroid(tri);
            const c = worldToCanvas(centroid, transform);
            ctx.fillText(id, c.x, c.y);
          }
        }
      }

      function drawStepToContext(ctx, step, params, size, padding, isExport = false) {
        ctx.clearRect(0, 0, size, size);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, size, size);

        const points = step.points;
        if (!points || points.length < 2) return;

        const transform = fixedAxisTransform(size, size, padding);
        const formOpacity = clamp(params.showFormOpacity ?? 0.35, 0.2, 1);
        const style = isExport
          ? {
              mainStroke: "rgb(0, 0, 0)",
              prevStroke: "rgb(160, 160, 160)",
              constructionStroke: "rgb(120, 120, 120)",
              baseFill: "rgb(0, 0, 0)",
              centerFill: "rgb(0, 0, 0)",
              posFill: "rgb(208, 64, 50)",
              negFill: "rgb(29, 111, 66)",
              mainWidth: 2.2,
              prevWidth: 1.2,
              constructionWidth: 1.0,
              formFill: `rgba(0, 0, 0, ${formOpacity})`,
              axisStroke: "rgba(0, 0, 0, 0.2)",
              axisWidth: 1.1,
              baseRadius: 3.2,
              centerRadius: 3.4,
              polarityRadius: 3.6,
            }
          : {
              mainStroke: "#111111",
              prevStroke: "rgba(0, 0, 0, 0.25)",
              constructionStroke: "rgba(0, 0, 0, 0.45)",
              baseFill: "#111111",
              centerFill: "#111111",
              posFill: "#d04032",
              negFill: "#1d6f42",
              mainWidth: 1.2,
              prevWidth: 0.8,
              constructionWidth: 0.9,
              formFill: `rgba(0, 0, 0, ${formOpacity})`,
              axisStroke: "rgba(0, 0, 0, 0.2)",
              axisWidth: 0.9,
              baseRadius: 2.4,
              centerRadius: 2.6,
              polarityRadius: 2.8,
            };

        if (params.showAxis) {
          ctx.strokeStyle = style.axisStroke;
          ctx.lineWidth = style.axisWidth;
          ctx.beginPath();
          const axisTop = worldToCanvas({ x: 0, y: 0.5 }, transform);
          const axisBottom = worldToCanvas({ x: 0, y: -0.5 }, transform);
          ctx.moveTo(axisTop.x, axisTop.y);
          ctx.lineTo(axisBottom.x, axisBottom.y);
          ctx.stroke();

          if (step.meta && step.meta.axisLinks?.length) {
            ctx.strokeStyle = style.axisStroke;
            ctx.lineWidth = style.axisWidth;
            const linkSets = SYMMETRIC_DISPLAY
              ? [step.meta.axisLinks, mirrorSegments(step.meta.axisLinks)]
              : [step.meta.axisLinks];
            linkSets.forEach((segments) => {
              ctx.beginPath();
              for (const seg of segments) {
                const a = worldToCanvas(seg.a, transform);
                const b = worldToCanvas(seg.b, transform);
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
              }
              ctx.stroke();
            });
          }
        }

        if (params.showConstructionLines && step.prevPoints && step.prevPoints.length >= 2) {
          ctx.strokeStyle = style.prevStroke;
          ctx.lineWidth = style.prevWidth;
          const prevSets = SYMMETRIC_DISPLAY
            ? [step.prevPoints, mirrorPoints(step.prevPoints)]
            : [step.prevPoints];
          prevSets.forEach((pts) => {
            drawBoundaryPath(ctx, pts, transform, params.smoothing);
            ctx.stroke();
          });
        }

        if (params.showForm && step.meta) {
          drawFormLayer(ctx, step, points, transform, style, false, params.showTriangleIds);
          return;
        }

        if (params.showConstructionPoints && step.meta) {
          const targetList = step.meta.targets && step.meta.targets.length > 0 ? step.meta.targets : [];
          const centers = targetList.length
            ? uniquePoints(targetList)
            : step.meta.center
            ? [step.meta.center]
            : [];
          if (centers.length) {
            ctx.fillStyle = style.centerFill;
            const centerSets = SYMMETRIC_DISPLAY ? centers.concat(centers.map(mirrorPoint)) : centers;
            for (const center of centerSets) {
              const c = worldToCanvas(center, transform);
              ctx.beginPath();
              ctx.arc(c.x, c.y, style.centerRadius, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }

        ctx.strokeStyle = style.mainStroke;
        ctx.lineWidth = style.mainWidth;
        const pointSets = SYMMETRIC_DISPLAY ? [points, mirrorPoints(points)] : [points];
        pointSets.forEach((pts) => {
          drawBoundaryPath(ctx, pts, transform, params.smoothing);
          ctx.stroke();
        });

        if (step.construction.links.length && params.showConstructionLines) {
          ctx.strokeStyle = style.constructionStroke;
          ctx.lineWidth = style.constructionWidth;
          ctx.setLineDash([4, 3]);
          const linkSets = SYMMETRIC_DISPLAY
            ? [step.construction.links, mirrorSegments(step.construction.links)]
            : [step.construction.links];
          linkSets.forEach((segments) => {
            ctx.beginPath();
            for (const seg of segments) {
              const a = worldToCanvas(seg.a, transform);
              const b = worldToCanvas(seg.b, transform);
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
            }
            ctx.stroke();
          });
          ctx.setLineDash([]);
        }

        if (params.showConstructionLines && step.meta && step.meta.contractionLinks?.length) {
          ctx.strokeStyle = style.constructionStroke;
          ctx.lineWidth = style.constructionWidth;
          ctx.setLineDash([4, 3]);
          const linkSets = SYMMETRIC_DISPLAY
            ? [step.meta.contractionLinks, mirrorSegments(step.meta.contractionLinks)]
            : [step.meta.contractionLinks];
          linkSets.forEach((segments) => {
            ctx.beginPath();
            for (const seg of segments) {
              const a = worldToCanvas(seg.a, transform);
              const b = worldToCanvas(seg.b, transform);
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
            }
            ctx.stroke();
          });
          ctx.setLineDash([]);
        }

        if (params.showConstructionPoints) {
          ctx.fillStyle = style.baseFill;
          const baseSets = SYMMETRIC_DISPLAY
            ? step.construction.bases.concat(step.construction.bases.map(mirrorPoint))
            : step.construction.bases;
          for (const base of baseSets) {
            const pt = worldToCanvas(base, transform);
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, style.baseRadius, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        if (params.showPolarityPoints && step.meta && step.meta.polarity) {
          const posList = step.meta.polarity.pos || [];
          const negList = step.meta.polarity.neg || [];
          const posSets = SYMMETRIC_DISPLAY ? posList.concat(posList.map(mirrorPoint)) : posList;
          const negSets = SYMMETRIC_DISPLAY ? negList.concat(negList.map(mirrorPoint)) : negList;

          ctx.fillStyle = style.posFill;
          for (const p of posSets) {
            const pt = worldToCanvas(p, transform);
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, style.polarityRadius, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.fillStyle = style.negFill;
          for (const p of negSets) {
            const pt = worldToCanvas(p, transform);
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, style.polarityRadius, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        if (params.showConstructionLines && step.meta && step.meta.polarity) {
          const links = step.meta.polarity.posLinks || [];
          if (links.length) {
            ctx.strokeStyle = style.constructionStroke;
            ctx.lineWidth = style.constructionWidth;
            ctx.setLineDash([4, 3]);
            const linkSets = SYMMETRIC_DISPLAY ? [links, mirrorSegments(links)] : [links];
            linkSets.forEach((segments) => {
              ctx.beginPath();
              for (const seg of segments) {
                const a = worldToCanvas(seg.a, transform);
                const b = worldToCanvas(seg.b, transform);
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
              }
              ctx.stroke();
            });
            ctx.setLineDash([]);
          }
        }

        if (params.showEdgeIds && step.segmentGroup && step.segmentGroup.length === points.length - 1) {
          const groupSets = SYMMETRIC_DISPLAY ? [points, mirrorPoints(points)] : [points];
          ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
          ctx.font = "11px Trebuchet MS, Segoe UI, Tahoma, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          groupSets.forEach((pts) => {
            for (let i = 0; i < pts.length - 1; i += 1) {
              const a = worldToCanvas(pts[i], transform);
              const b = worldToCanvas(pts[i + 1], transform);
              const mx = (a.x + b.x) * 0.5;
              const my = (a.y + b.y) * 0.5;
              const g = step.segmentGroup[i] ?? 0;
              ctx.fillText(String(g), mx, my);
            }
          });
        }
      }

      function drawStep(canvas, step, params) {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round(TILE_SIZE * dpr);
        canvas.height = Math.round(TILE_SIZE * dpr);
        canvas.style.width = `${TILE_SIZE}px`;
        canvas.style.height = `${TILE_SIZE}px`;

        const ctx = canvas.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        drawStepToContext(ctx, step, params, TILE_SIZE, PADDING);
      }

      function renderSteps(stepPolylines, params) {
        ui.tiles.innerHTML = "";
        const startIndex = stepPolylines.length > 2 ? 2 : 0;
        stepPolylines.slice(startIndex).forEach((step, offset) => {
          const index = startIndex + offset;
          const tile = document.createElement("div");
          tile.className = "tile";

          const canvas = document.createElement("canvas");
          const label = document.createElement("div");
          label.className = "label";
          const typeTag =
            step.meta?.type === "contraction" ? "C" : step.meta?.type === "expansion" ? "E" : "S";
          label.textContent = `${offset + 1}${typeTag}`;

          tile.appendChild(canvas);
          tile.appendChild(label);
          ui.tiles.appendChild(tile);

          drawStep(canvas, step, params);
        });
      }

      function renderFinalStep(stepPolylines, params) {
        if (!ui.finalCanvas) return;
        const finalStep = stepPolylines.length > 0 ? stepPolylines[stepPolylines.length - 1] : null;
        if (!finalStep) {
          const dpr = window.devicePixelRatio || 1;
          ui.finalCanvas.width = Math.round(TILE_SIZE * dpr);
          ui.finalCanvas.height = Math.round(TILE_SIZE * dpr);
          ui.finalCanvas.style.width = `${TILE_SIZE}px`;
          ui.finalCanvas.style.height = `${TILE_SIZE}px`;
          const ctx = ui.finalCanvas.getContext("2d");
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, TILE_SIZE, TILE_SIZE);
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, TILE_SIZE, TILE_SIZE);
          return;
        }
        drawStep(ui.finalCanvas, finalStep, params);
      }

      function update() {
        const params = readParams();
        updateReadouts(params);
        const steps = generateSteps(params);
        renderSteps(steps, params);
        renderFinalStep(steps, params);
      }

      const inputs = document.querySelectorAll("input, select");
      inputs.forEach((input) => input.addEventListener("input", update));
      window.addEventListener("resize", update);
      ui.exportSteps.addEventListener("click", () => exportSteps());

      update();

      function canvasToBlob(canvas) {
        return new Promise((resolve) => {
          canvas.toBlob((blob) => resolve(blob), "image/png");
        });
      }

      async function exportSteps() {
        const params = readParams();
        const steps = generateSteps(params);

        const offscreen = document.createElement("canvas");
        offscreen.width = EXPORT_SIZE;
        offscreen.height = EXPORT_SIZE;
        const ctx = offscreen.getContext("2d");

        const startIndex = steps.length > 1 ? 1 : 0;
        for (let i = startIndex; i < steps.length; i += 1) {
          drawStepToContext(ctx, steps[i], params, EXPORT_SIZE, EXPORT_PADDING, true);
          const blob = await canvasToBlob(offscreen);
          if (!blob) continue;
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.download = `step_${String(i).padStart(2, "0")}.png`;
          link.href = url;
          link.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          await new Promise((resolve) => setTimeout(resolve, 120));
        }
      }
    </script>
  </body>
</html>
